# 等待用户输入最长时间，超时则自动取消此次任务
wait_for_user_input_timeout: 300
# 子Workflow
wait_panel_workflow_timeout: 30000
# 单次任务执行最长时间
task_execute_timeout: 900
# 节点超时时间设置，默认为2小时
default_execution_node_timeout: 7200
# 节点默认值配置
type_default_value_dict:
  string: ""
  integer: null
  number: null
  boolean: null
  array: null
  object: null
  error: null