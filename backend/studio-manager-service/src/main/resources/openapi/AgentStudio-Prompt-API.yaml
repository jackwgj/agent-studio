swagger: '2.0'
info:
  description: API for managing prompt engineer tasks, including create, query, update and delete operations.
  version: 1.0.0
  title: Prompt Engineer API
host: your.api.host
basePath: /
schemes:
  - http
  - https
paths:
  /v2/{project_id}/prompt/tasks/draft:
    post:
      tags:
        - Prompt Engineer
      summary: 创建提示词优化任务草稿
      description: Create a new prompt optimization task
      operationId: CreatePromptTaskDraft
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PromptTaskCreateReq'
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/CreatePromptTaskRsp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks:
    get:
      tags:
        - Prompt Engineer
      summary: 查询提示词优化任务列表
      description: 获取指定项目下的提示词优化任务列表，支持分页和多种筛选条件
      operationId: ListPromptTasks
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 工作空间ID，用于限定任务所属的工作空间
        - name: name
          in: query
          type: string
          description: 任务名称模糊查询，支持通配符匹配
          minLength: 0
          maxLength: 64
        - name: status
          in: query
          type: string
          description: 任务状态筛选，取值范围为：0-草稿，1-等待执行，2-执行中，3-执行成功，4-执行失败，5-暂停,6-任务暂停中
          pattern: ^(DRAFT|WAITING|RUNNING|SUCCESS|FAILED|PAUSE|PAUSING)$
        - name: type
          in: query
          type: string
          description: 任务类型（文本or多模态)
        - name: pageNum
          in: query
          type: integer
          default: 1
          minimum: 1
          description: 当前页码，必须为大于等于1的整数
        - name: pageSize
          in: query
          type: integer
          default: 10
          minimum: 10
          maximum: 100
          description: 每页显示条数，取值范围为1到100
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}:
    post:
      tags:
        - Prompt Engineer
      summary: 创建提示词优化任务
      description: Create a new prompt optimization task
      operationId: CreatePromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/CreatePromptTaskRsp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
    get:
      tags:
        - Prompt Engineer
      summary: 查询提示词优化任务详情
      description: Get details of a specific prompt optimization task
      operationId: GetPromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          description: 空间id
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
    put:
      tags:
        - Prompt Engineer
      summary: 全量更新提示词优化任务（只能更新草稿）
      description: Fully update a prompt optimization task (all fields required)
      operationId: UpdatePromptTaskDraft
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PromptTaskCreateReq'
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
    delete:
      tags:
        - Prompt Engineer
      summary: 删除提示词优化任务
      description: Delete a prompt optimization task
      operationId: DeletePromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseInfo'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/copy:
    post:
      tags:
        - Prompt Engineer
      summary: 创建副本
      description: Create a copy the prompt optimization task
      operationId: CopyPromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/CreatePromptTaskRsp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/eval/{iter_num}:
    get:
      tags:
        - Prompt Engineer
      summary: 查询提示词优化任务某一轮迭代评估数据集预测结果
      description: Get eval details of a specific iter prompt optimization task
      operationId: GetPromptTaskIterEvalRes
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: iter_num
          in: path
          required: true
          type: string
          description: 迭代轮次
        - name: workspace_id
          in: query
          type: string
          description: 空间id
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/start:
    post:
      tags:
        - Prompt Engineer
      summary: 启动提示词优化任务
      description: 将任务从草稿(0)或等待执行(1)状态启动为执行中(2)
      operationId: StartPromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 启动成功
          schema:
            $ref: '#/definitions/PromptBaseInfo'
        400:
          description: 启动失败（如当前状态不允许启动）
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/pause:
    post:
      tags:
        - Prompt Engineer
      summary: 暂停提示词优化任务
      description: 将执行中(2)的任务暂停，状态变更为等待执行(1)
      operationId: PausePromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 暂停成功
          schema:
            $ref: '#/definitions/PromptBaseInfo'
        400:
          description: 暂停失败（如当前状态不允许暂停）
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/resume:
    post:
      tags:
        - Prompt Engineer
      summary: 继续提示词优化任务
      description: 将暂停状态(1)的任务恢复为执行中(2)
      operationId: ResumePromptTask
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
      responses:
        200:
          description: 继续成功
          schema:
            $ref: '#/definitions/PromptBaseInfo'
        400:
          description: 继续失败（如当前状态不允许继续）
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/data/items:
    post:
      tags:
        - Prompt Engineer DataSet
      summary: 向优化任务添加单条数据用例
      description: Add a single data item to an existing dataset
      operationId: AddSingleEvalDataSetItem
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PromptEvalDataItem'
      responses:
        200:
          description: 添加成功
          schema:
            $ref: '#/definitions/BaseInfo'
        400:
          description: 操作失败
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 数据集不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/data/batchItems:
    post:
      tags:
        - Prompt Engineer DataSet
      summary: 向优化任务批量添加数据用例
      description: Add batch data item to an existing dataset
      operationId: AddBatchEvalDataSetItem
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - name: body
          in: body
          required: true
          schema: # OpenAPI 2.0 必须用 schema 包裹请求体结构
            type: array  # 顶层类型为数组（批量数据）
            maxItems: 500
            minItems: 0
            items:
              $ref: '#/definitions/PromptEvalDataItem'  # 数组元素引用预定义模型
      responses:
        200:
          description: 添加成功
          schema:
            $ref: '#/definitions/BaseInfo'
        400:
          description: 操作失败
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 数据集不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/upload/picture:
    post:
      tags:
        - Prompt Engineer DataSet
      summary: 上传图片，获得临时url
      description: Import picture to get temp url
      operationId: UploadPicture
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - name: file
          in: formData
          required: true
          type: file
          description: 包含数据用例的文件（支持jsonl）
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        400:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 操作失败,返回错误信息
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/data/import:
    post:
      tags:
        - Prompt Engineer DataSet
      summary: 通过文件导入批量添加数据用例
      description: Import multiple data items to a dataset via file upload (supports jsonl formats)
      operationId: ImportEvalDataSetItems
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - name: file
          in: formData
          required: true
          type: file
          description: 包含数据用例的文件（支持jsonl）
      responses:
        200:
          description: 添加成功
          schema:
            $ref: '#/definitions/BaseInfo'
        400:
          description: 操作失败
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 数据集不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/data/download:
    get:
      tags:
        - Prompt Engineer DataSet
      summary: 下载数据用例模板
      description: 下载一个包含 data.json 和图片文件夹的压缩包模板，用于数据导入
      operationId: DownloadEvalDataSetTemplate
      produces:
        - application/zip
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 空间ID
        - name: ptType
          in: query
          type: string
          description: 提示词优化任务类型
          enum: [ text, multi ]
      responses:
        200:
          description: 下载成功，返回压缩包
          schema:
            type: file
        400:
          description: 参数缺失或格式错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 任务或项目不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'
  /v2/{project_id}/prompt/tasks/{task_id}/data/list:
    get:
      tags:
        - Prompt Engineer DataSet
      summary: 查询优化任务数据列表
      description: Get list of a specific dataset including its items
      operationId: ListEvalDataSet
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - name: pageNum
          in: query
          type: integer
          default: 1
          minimum: 1
          description: 数据用例页码
        - name: pageSize
          in: query
          type: integer
          default: 20
          minimum: 10
          maximum: 100
          description: 数据用例每页条数
      responses:
        200:
          description: 操作成功
          schema:
            $ref: '#/definitions/PromptBaseResp'
        404:
          description: 数据集不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

  /v2/{project_id}/prompt/tasks/{task_id}/data/items/{item_id}:
    delete:
      tags:
        - Prompt Engineer DataSet
      summary: 删除优化任务中的单条用例
      description: Delete a specific data item from a dataset
      operationId: DeleteEvalDataSetItem
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: item_id
          in: path
          required: true
          type: string
          description: 数据用例ID
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
      responses:
        200:
          description: 删除成功
          schema:
            $ref: '#/definitions/BaseInfo'
        404:
          description: 数据集或数据用例不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

    put:
      tags:
        - Prompt Engineer DataSet
      summary: 更新优化任务中的单条用例
      description: Update a specific data item in a dataset
      operationId: UpdateEvalDataSetItem
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: task_id
          in: path
          required: true
          type: string
          description: 优化任务ID
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: item_id
          in: path
          required: true
          type: string
          description: 数据用例ID
        - name: workspace_id
          in: query
          type: string
          required: true
          description: 空间id
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PromptEvalDataItem'
      responses:
        200:
          description: 更新成功
          schema:
            $ref: '#/definitions/PromptEvalDataItem'
        400:
          description: 操作失败
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        404:
          description: 数据集或数据用例不存在
          schema:
            $ref: '#/definitions/PromptErrorInfo'
        500:
          description: 服务器错误
          schema:
            $ref: '#/definitions/PromptErrorInfo'

definitions:
  PromptBaseResp:
    type: object
    properties:
      code:
        type: integer
      message:
        type: string
      data:
        type: object

  PromptTaskListRsp:
    type: object
    description: 提示词任务列表响应
    properties:
      total:
        type: integer
        description: 总记录数
        example: 100
      data:
        type: array
        items:
          $ref: '#/definitions/PromptTaskVo'

  PromptTaskCreateReq:
    type: object
    description: 创建提示词任务请求
    required: # 新增必填配置
      - name
      - workspaceId
    properties:
      name:
        type: string
        description: 提示词优化任务名称
        minLength: 1
        maxLength: 64
        example: "产品描述优化任务"
      desc:
        type: string
        description: 提示词优化任务描述
        minLength: 0
        maxLength: 256
        example: "针对新产品的营销文案进行AI提示词优化，提升生成质量"
      promptId:
        type: string
        description: 关联的我的提示词id
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      execTime:
        type: integer
        format: int64
        description: 提示词优化任务执行时间
        example: "时间戳"
      ptType:
        type: string
        description: 提示词优化任务类型
        enum: [text, multi]
        example: "text"
      ptText:
        type: string
        description: 优化文本
        minLength: 0
        maxLength: 10000
        example: "请生成一段吸引人的产品介绍"
      ptVars:
        type: string
        description: 提示词变量
        maxLength: 1200
        example: '[{name: product, content, type: text或者multi}]'
      dataSetId:
        type: string
        description: 优化数据集id
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 'dataSet_0001'
      ptObject:
        type: object
        description: 优化提示词模型或者agent
        $ref: '#/definitions/ExecConfig'
      assitantObject:
        type: object
        description: 提示词推理模型或者agent
        $ref: '#/definitions/ExecConfig'
      maxIterNum:
        type: integer
        description: 提示词优化任务最大迭代次数
        example: 5
        maximum: 20
        minimum: 1
      targetAcc:
        type: string
        description: 提示词优化任务目标精度
        example: "95%"
      showCaseNum:
        type: integer
        description: 终提示词里的示例个数
        example: 3
        maximum: 5
        minimum: 0
      targetType:
        type: string
        description: 用例的目标类型
        enum: [ objective, subjective ]
        example: "objective"
      scoreStandard:
        type: string
        description: 评分标准
        example: "内容相关性:30分,语言流畅度:20分,创新性:50分"
        maxLength: 5000
      backKnowledge:
        type: string
        description: 背景知识
        example: "该产品是2023年新款智能手表，主打健康监测功能"
        maxLength: 5000
      algorithm:
        type: string
        description: 优化算法
        enum: [ greedy, beamsearch ]
        example: "greedy"

  PromptTaskVo:
    type: object
    description: 提示词优化任务详情
    required:
      - name
      - desc
    properties:
      id:
        type: string
        description: 唯一标识一个提示词优化任务
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: "task_123456789"
      name:
        type: string
        description: 提示词优化任务名称
        minLength: 1
        maxLength: 64
        example: "产品描述优化任务"
      desc:
        type: string
        description: 提示词优化任务描述
        minLength: 0
        maxLength: 1024
        example: "针对新产品的营销文案进行AI提示词优化，提升生成质量"
      dataSetId:
        type: string
        description: 提示词优化任务绑定的数据集
        example: "dataSet_000001"
      ptType:
        type: string
        description: 提示词优化任务类型
        example: "text"
      ptText:
        type: string
        description: 优化文本
        minLength: 1
        maxLength: 10000
        example: "请生成一段吸引人的产品介绍"
      ptVar:
        type: string
        description: 提示词变量，需要时json字符串
        example: "{product: 智能手表, target: 年轻人}"
      execTime:
        type: integer
        format: int64
        description: 提示词优化任务执行时间
      ptModel:
        type: string
        description: 优化提示词模型
        example: "GPT-4"
      execObject:
        type: string
        description: 提示词优化任务执行对象
        example: "marketing_team"
      maxIterNum:
        type: integer
        description: 提示词优化任务最大迭代次数
        minimum: 1
        maximum: 100
        example: 5
      targetAcc:
        type: string
        description: 提示词优化任务目标精度
        example: "95%"
      showCaseNum:
        type: integer
        description: 终提示词里的示例个数，最多为用例集里的用例个数
        example: 3
      targetType:
        type: string
        description: 用例的目标类型
        enum: [ objective, subjective ]
        example: "objective"
      scoreStandard:
        type: string
        description: 评分标准
        example: "内容相关性:30分,语言流畅度:20分,创新性:50分"
      backKnowledge:
        type: string
        description: 背景知识
        minLength: 1
        maxLength: 65535
        example: "该产品是2023年新款智能手表，主打健康监测功能"
      status:
        type: integer
        description: 运行状态(0-草稿,1-等待执行,2-执行中,3-执行成功,4-执行失败)
        enum: [0, 1, 2, 3, 4]
        example: 2
      projectId:
        type: string
        description: 项目id
        example: "project_987654"
      workspaceId:
        type: string
        description: 空间id
        example: "workspace_112233"
      createdTime:
        type: integer
        format: int64
        description: 创建时间
      creator:
        type: string
        description: 工具创建者
        minLength: 1
        maxLength: 64
        example: "张三"
      creatorId:
        type: string
        description: 工具创建者user id
        example: "user_654321"
      updatedTime:
        type: integer
        format: int64
        description: 更新时间
      iterationResults:
        type: array
        description: 该提示词任务的所有迭代结果（按迭代轮次升序排列）
        items:
          $ref: '#/definitions/PromptIterationResultVo'

  CreatePromptTaskRsp:
    type: object
    description: 创建提示词优化工程响应
    required: # 新增必填配置
      - task_id
    properties:
      task_id:
        type: string
        description: 任务ID
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64

  PromptErrorInfo:
    type: object
    description: 错误信息
    properties:
      code:
        type: integer
        example: 400
      message:
        type: string
        example: "操作失败"
      details:
        type: string
        description: 错误详情
        example: "任务名称不能为空"

  PromptIterationResultVo:
    type: object
    description: 提示词迭代结果信息
    required: # 新增必填配置
      - taskId
      - iterNum
    properties:
      id:
        type: string
        description: 迭代任务唯一标识
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      taskId:
        type: string
        description: 关联的提示词优化任务ID
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      iterNum:
        type: integer
        description: 迭代轮次
        minimum: 0
        maximum: 100
        example: 3
      oriPt:
        type: string
        description: 原始提示词（迭代前）
        example: "请生成一段产品介绍"
      resPt:
        type: string
        description: 该轮迭代后的提示词
        example: "请生成一段针对年轻人的智能手表产品介绍，突出健康监测功能"
      resAcc:
        type: string
        description: 该轮迭代后的精度
        example: "92%"
      createdTime:
        type: integer
        format: int64
        description: 记录创建时间（迭代完成时间）

  PromptBaseInfo:
    type: object
    properties:
      task_id:
        type: string
        example: "task_01"
      message:
        type: string
        example: "删除成功"

  PromptEvalDataItem:
    type: object
    description: 数据集条目
    properties:
      id:
        type: string
        description: 条目唯一标识（创建时可不传，系统自动生成）
        example: "item_789"
      content:
        type: string
        description: 数据内容，json字符串
        example: "{var1 : xx, bb : xx}"
        maxLength: 40000

  PromptEvalDataSetVo:
    type: object
    description: 数据集详情
    properties:
      id:
        type: string
        description: 数据集ID
        example: "dataset_123"
      workspaceId:
        type: string
        description: 空间id
        example: "workspace_456"
      projectId:
        type: string
        description: 项目ID
        example: "project_789"
      boundTaskIds:
        type: array
        items:
          type: string
        description: 已绑定的任务ID列表
        example: ["task_321", "task_654"]
      items:
        type: array
        items:
          $ref: '#/definitions/PromptEvalDataItem'
        description: 数据用例列表（分页）
      itemTotal:
        type: integer
        description: 数据用例总数量
        example: 100
      itemIndex:
        type: integer
        description: 当前数据用例页码
        example: 100
      pageSize:
        type: integer
        description: 数据页大小
        example: 10
      message:
        type: string
        example: "数据集创建成功"

  BaseInfo:
    type: object
    properties:
      id:
        type: string
      code:
        type: integer
      message:
        type: string

  ExecConfig:
    type: object
    description: 大模型参数配置
    properties:
      model:
        type: string
        description: 模型或者智能体id
        maxLength: 128
      exec_type:
        type: string
        description: 模型或者智能体id
        enum: [model, agent]
      top_p:
        type: number
        format: double
        description: top_p
        default: 1
      temperature:
        type: number
        format: double
        description: 温度
        default: 0
      max_tokens:
        type: integer
        format: int32
        description: 输出最大token长度