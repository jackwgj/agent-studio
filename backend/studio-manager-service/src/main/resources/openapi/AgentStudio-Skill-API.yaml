swagger: "2.0"
info:
  title: Skill
  description: Skill Management
  version: 1.0.0
host: localhost.com
schemes:
  - https
basePath: /
tags:
    - name: SkillManagement
paths:
  /v1/{project_id}/agent-manager/skills:
    get:
      tags:
        - SkillManagement
      summary: 查询Skill列表
      description: 查询Skill列表，支持多种过滤条件。
      operationId: ListStudioSkills
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/Limit'
        - $ref: '#/parameters/Offset'
        - $ref: '#/parameters/SkillStatus'
        - $ref: '#/parameters/SkillName'
        - $ref: '#/parameters/SkillDescription'
        - $ref: '#/parameters/SkillSource'
        - $ref: '#/parameters/PriorityStatus'
        - $ref: '#/parameters/WorkspaceId'
        - $ref: '#/parameters/ProjectId'
        - $ref: '#/parameters/TagId'
        - $ref: '#/parameters/PublishedAsset'
      responses:
        '200':
          description: 查询成功。
          schema:
            $ref: '#/definitions/ListStudioSkillsResponseBody'
        '400':
          description: Bad Request 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '403':
          description: Forbidden 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 0

  /v1/{project_id}/agent-manager/skills/{skill_id}:
    get:
      tags:
        - SkillManagement
      summary: 查询Skill详情
      description: 查询Skill详细信息。
      operationId: ShowStudioSkillDetail
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/SkillId'
        - $ref: '#/parameters/WorkspaceId'
        - $ref: '#/parameters/ProjectId'
      responses:
        '200':
          description: 查询成功。
          schema:
            $ref: '#/definitions/GetStudioSkillDetailsResponseBody'
        '400':
          description: Bad Request 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '403':
          description: Forbidden 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 0

    delete:
      tags:
        - SkillManagement
      summary: 删除Skill
      description: 删除Skill。
      operationId: DeleteStudioSkill
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/SkillId'
        - $ref: '#/parameters/WorkspaceId'
        - $ref: '#/parameters/ProjectId'
      responses:
        '204':
          description: 删除成功，无响应返回。
        '400':
          description: Bad Request 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '403':
          description: Forbidden 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 0

  /v1/{project_id}/agent-manager/skills/import:
    post:
      tags:
        - SkillManagement
      summary: 导入Skill
      description: 导入Skill，支持上传zip包或obs分享文件。
      operationId: ImportStudioSkill
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: file
          in: formData
          description: Skill ZIP包文件
          type: file
          required: true
        - $ref: '#/parameters/WorkspaceId'
        - $ref: '#/parameters/ProjectId'
      responses:
        '200':
          description: 导入成功，返回导入的Skill信息。
          schema:
            $ref: '#/definitions/ImportStudioSkillResponseBody'
        '400':
          description: Bad Request 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '403':
          description: Forbidden 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 1

  /v1/{project_id}/agent-manager/skills/{skill_id}/export:
    post:
      tags:
        - SkillManagement
      summary: 导出Skill
      description: 导出指定Skill的最新版本。
      operationId: ExportStudioSkill
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/SkillId'
        - $ref: '#/parameters/WorkspaceId'
        - $ref: '#/parameters/ProjectId'
      responses:
        '200':
          description: 导出成功，返回带有鉴权信息的obs_url。
          schema:
            $ref: '#/definitions/ExportStudioSkillResponseBody'
        '400':
          description: Bad Request 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '403':
          description: Forbidden 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 2

definitions:
  GetStudioSkillDetailsResponseBody:
    type: object
    properties:
      skill_info:
        $ref: '#/definitions/StudioSkillInfo'

  ListStudioSkillsResponseBody:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/StudioSkillInfo'
        minItems: 0
        maxItems: 50
      total:
        type: integer
        description: 总记录数。
        minimum: 0
        maximum: 1000000
        example: 1
    required:
      - items
      - total

  #  Skill 基本元素
  SkillId:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Skill ID。
    example: 00b5c851-6cb4-4dff-b961-e73665cfdd08
  SkillName:
    type: string
    description: Skill 名称。
    minLength: 1
    maxLength: 64
    example: new-skill
  SkillDescription:
    type: string
    description: Skill 描述。
    minLength: 1
    maxLength: 1024
    example: Guide for creating effective skills. This skill should be used when users want to create a new skill (or update an existing skill) that extends Claude's capabilities with specialized knowledge, workflows, or tool integrations.
  SkillObsUrl:
    type: string
    description: Skill 临时下载url。
    minLength: 1
    maxLength: 1024
    example: https://core-tools-cn-north-7-123.obs.cn-north-7/skills/skill-abc123/v2/skill-package.zip
  SkillObsPath:
    type: string
    description: 对象存储地址。
    minLength: 1
    maxLength: 1024
    example: user-id/skills/skill-abc123/v2/skill-package.zip
  SkillStatus:
    type: string
    description: Skill 状态： developed 为可用；develop 为开发中。
    enum: [developed, developing]
  UsedVersionName:
    type: string
    description: Skill 版本名。
    minLength: 1
    maxLength: 32
    example: fxssgde
  SkillOutputIcon:
    type: string
    description: Skill 图标Base64信息。
    example: >-
      data:image/svg+xml;base64,
  SkillInputIcon:
    type: string
    description: Skill 图标名字。
    minLength: 1
    maxLength: 64
    example: "44369939-d06c-4dfa-9f1b-e8152aa87794.png"
  SkillSource:
    type: string
    description: Skill 类型; custom 为自定义，import 为导入。
    enum: [custom, import]
  CreatedTime:
    type: integer
    format: int64
    description: 创建时间。
    example: 1774508635000
  UpdatedTime:
    type: integer
    format: int64
    description: 更新时间。
    example: 1774508635000
  CreatorId:
    type: string
    description: 创建用户Id
    example: d25142d9f87042c59d2f588743efe660
  CreatorName:
    type: string
    description: 创建用户名。
    minLength: 1
    maxLength: 64
    example: skill-creator
  VersionUsed:
    type: boolean
    description: 版本启用情况; true 为启用，false 为未启用。
  VersionId:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Skill Version ID。
    example: 00b5c851-6cb4-4dff-b961-e73665cfdd08
  DomainId:
    type: string
    example: 012938002bbn2
  LatestVersion:
    type: string
    description: 最新版本号。
    minLength: 1
    maxLength: 64
    example: 53e534a9-db95-4832-a4ba-31594553d267
  UsedVersion:
    type: string
    description: 启用版本号。
    minLength: 1
    maxLength: 64
    example: 53e534a9-db95-4832-a4ba-31594553d267

  StudioSkillInfo:
    type: object
    description: Skill 基本信息。
    properties:
      skill_id:
        $ref: '#/definitions/SkillId'
      skill_name:
        $ref: '#/definitions/SkillName'
      icon:
        $ref: '#/definitions/SkillOutputIcon'
      status:
        $ref: '#/definitions/SkillStatus'
      source:
        $ref: '#/definitions/SkillSource'
      description:
        $ref: '#/definitions/SkillDescription'
      created_time:
        $ref: '#/definitions/CreatedTime'
      creator_name:
        $ref: '#/definitions/CreatorName'
      updated_time:
        $ref: '#/definitions/UpdatedTime'
      obs_url:
        $ref: '#/definitions/SkillObsUrl'
      obs_path:
        $ref: '#/definitions/SkillObsPath'
      domain_id:
        $ref: '#/definitions/DomainId'
      latest_version:
        $ref: '#/definitions/LatestVersion'
      used_version:
        $ref: '#/definitions/UsedVersion'
      used_version_name:
        $ref: '#/definitions/UsedVersionName'

  ExportStudioSkillResponseBody:
    type: object
    description: 导出Skill响应体
    properties:
      obs_url:
        $ref: '#/definitions/SkillObsUrl'
        description: 带有鉴权信息的OBS URL，前端可直接下载zip包
      skill_name:
        $ref: '#/definitions/SkillName'
        description: 导出的Skill名称
      version_name:
        $ref: '#/definitions/UsedVersionName'
        description: 导出的Skill版本号
      skill_id:
        $ref: '#/definitions/SkillId'
        description: 导出的Skill ID
    required:
      - obs_url
      - skill_name
      - version
      - skill_id

  ImportStudioSkillResponseBody:
    type: object
    description: 导入Skill响应体
    properties:
      skill_id:
        $ref: '#/definitions/SkillId'
        description: 导入的Skill ID
      skill_name:
        $ref: '#/definitions/SkillName'
        description: 导入的Skill名称
      description:
        $ref: '#/definitions/SkillDescription'
        description: 导入的Skill描述
      obs_url:
        $ref: '#/definitions/SkillObsUrl'
        description: 上传到 OBS 的 URL
      version_name:
        $ref: '#/definitions/UsedVersionName'
        description: 导入后的版本名字
      status:
        $ref: '#/definitions/SkillStatus'
        description: Skill 状态（导入默认为可用的 developed）
      source:
        type: string
        description: Skill 来源（导入固定为 import）
        enum: [import]
    required:
      - id
      - name
      - description
      - obs_url
      - version
      - status
      - source

parameters:
  Offset:
    name: offset
    in: query
    required: false
    type: integer
    format: int32
    default: 0
    minimum: 0
    maximum: 10000
    description: 分页记录的起始位置偏移量,默认值0。
  Limit:
    name: limit
    in: query
    required: false
    type: integer
    format: int32
    default: 100
    minimum: 1
    maximum: 1000
    description: 每一页的数量，默认值100。
  SkillId:
    name: skill_id
    in: path
    required: true
    description: Skill ID。
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    x-example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  SkillStatus:
    name: status
    in: query
    required: false
    description: 匹配Skill 状态; developed 为可用， developing 为开发中
    type: string
    enum: [developed, developing]
  SkillName:
    name: name
    in: query
    description: 按 Skill 名称模糊搜索。
    type: string
    required: false
  SkillDescription:
    name: description
    in: query
    description: 按 Skill 描述模糊搜索。
    type: string
    required: false
  SkillSource:
    name: source
    in: query
    description: 创建方式过滤； custom 为自定义, import 为外部导入。
    type: string
    enum: [custom, import]
    required: false
  Type:
    name: type
    in: query
    description: 组件库和 spec driven 用同一个接口； 为 tool 时展示组件库的列表，否则展示 spec driven 的列表。
    type: string
    required: false
  VersionId:
    name: version_id
    type: string
    in: query
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Skill Version ID。
    required: true
    x-example: 0543ce4e-fa8f-4e71-8927-c453f90bd001
  PriorityStatus:
    name: priority_status
    type: string
    in: query
    description: 排序方法。status 为按照状态排序。
    required: false
    x-example: developed
  WorkspaceId:
    name: workspace_id
    in: query
    required: true
    type: string
    description: 空间ID
    pattern: ^[a-zA-Z0-9_()\-]{1,40}$
  ProjectId:
    name: project_id
    in: path
    required: true
    type: string
    pattern: ^[a-zA-Z0-9_-]{1,40}$
    description: 项目ID
  TagId:
    name: tag_id
    type: string
    in: query
    description: 分类标签。
    required: false
  PublishedAsset:
    name: published_asset
    type: integer
    in: query
    description: 是否已上架。
    required: false
