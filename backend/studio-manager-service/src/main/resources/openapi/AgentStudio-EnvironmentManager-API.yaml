definitions:
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
  VpcInfo:
    type: object
    description: vpc信息
    properties:
      id:
        type: string
        description: VPC资源ID
      name:
        type: string
        description: VPC的名称
      description:
        type: string
        description: VPC的描述信息
      cidr:
        type: string
        description: VPC下可用子网的范围
      status:
        type: string
        description: 状态
  ListSubnets:
    type: object
    description: 子网列表
    properties:
      subnet:
        type: array
        items:
          $ref: '#/definitions/SubnetInfo'
  SubnetInfo:
    type: object
    description: 子网信息
    properties:
      id:
        type: string
        description: subnet资源ID
      name:
        type: string
        description: 子网名称
      description:
        type: string
        description: 子网描述
      cidr:
        type: string
        description: 子网的网段
      status:
        type: string
        description: 状态，取值范围：ACTIVE,UNKNOWN,ERROR
  EnvironmentInfoRequest:
    type: object
    description: 安全组信息
    properties:
      name:
        type: string
        description: 环境名称
        pattern: "^[a-zA-Z][a-zA-Z0-9-]{3,47}$"
        x-pattern-msg: "允许大小写字母、数字、横线（-），只能是大小写英文字母开头,长度需要在4和48之间"
      id:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
        description: 环境id
        maxLength: 64
        minLength: 0
      description:
        type: string
        description: 描述信息
        pattern: "^(?:[\\u4e00-\\u9fa5a-zA-Z0-9][\\u4e00-\\u9fa5_a-zA-Z0-9\\-()]{0,127})?$"
        x-pattern-msg: "环境描述仅支持中英文、数字、下划线(_)、中划线(-)、小括号()、空格，以中英文、数字开头，长度需要在0和128之间"
        maxLength: 128
      vpcId:
        type: string
        description: 创建环境绑定的VPC的ID
        maxLength: 64
        minLength: 1
      subnetId:
        type: string
        description: 创建环境绑定的VPC入网子网的ID
        maxLength: 64
        minLength: 1
      isDefault:
        type: boolean
        description: 是否默认
        default: false
  Environments:
    type: object
    description: 安全组列表
    properties:
      total:
        type: integer
      env_info:
        type: array
        items:
          $ref: '#/definitions/Environment'
  Environment:
    type: object
    description: 环境信息
    properties:
      id:
        type: string
        description: 环境id
      name:
        type: string
        description: 环境名称
      description:
        type: string
        description: 环境描述
      isDefault:
        type: boolean
        description: 是否默认
      envVariable:
        type: string
        description: 环境变量
      vpcName:
        type: string
        description: 虚拟私有云名称
      subnetName:
        type: string
        description: 子网名称
      vpcCidr:
        type: string
        description: 子网的网段
      subnetCidr:
        type: string
        description: 子网的网段
      vpcEp:
        type: string
        description: vpcEp信息
      statusReason:
        type: string
        description: 环境状态失败原因
      eip:
        type: string
        description: 弹性ip
      status:
        type: string
        description: 状态
      createdOn:
        type: integer
        format: int64
        description: 创建时间
      updatedOn:
        type: integer
        format: int64
        description: 更新时间
  EnvironmentInstances:
    type: object
    description: 环境关联的实例信息
    properties:
      env_info:
        type: array
        items:
          $ref: '#/definitions/EnvironmentInstance'
      total:
        type: integer
  EnvironmentInstance:
    type: object
    description: 环境信息
    properties:
      agentName:
        type: string
        description: agent名称
      deployName:
        type: string
      status:
        type: string
        description: 实例的部署状态
      agentType:
        type: string
        description: 部署实例的类型
      version:
        type: string
        description: 版本
      workspaceName:
        type: string
        description: 部署的实例归属的空间名称
  EnvironmentVariables:
    type: object
    description: 环境变量
    properties:
      variables:
        type: array
        items:
          $ref: '#/definitions/EnvironmentVariable'
  EnvironmentVariable:
    type: object
    description: 环境变量
    properties:
      name:
        type: string
        pattern: "^[a-zA-Z_$][a-zA-Z0-9_$]{0,63}$"
      value:
        $ref: '#/definitions/EnvironmentVariableValue'
  EnvironmentVariableValue:
    type: object
    description: 环境变量值
    properties:
      type:
        type: string
        enum:
          - string
          - number
      content:
        type: string
        maxLength: 2000
      secret:
        type: boolean
  EnvironmentVariablesResp:
    type: object
    description: 环境变量列表
    properties:
      variables:
        type: array
        items:
          $ref: '#/definitions/EnvironmentVariableResp'
      total:
        type: integer
  EnvironmentVariableResp:
    type: object
    description: 环境变量
    properties:
      id:
        type: string
        description: 环境ID
      name:
        type: string
        description: 环境名称
      envDescription:
        type: string
        description: 环境描述
      variables:
        type: array
        items:
          $ref: '#/definitions/EnvironmentVariable'
      count:
        type: integer
        description: 环境变量数量
  EnvironmentVariablesExport:
    type: object
    description: 环境变量导出参数
    properties:
      environment_id:
        type: array
        items:
          type: string
          maxLength: 100
          pattern: ^[a-zA-Z0-9_-]+$
        maxItems: 50
        description: 导出的环境id
  EnvironmentVariablesImportRequest:
    type: object
    description: 环境变量导入参数
    properties:
      environment_id:
        type: string
        description: 导入的环境id
        maxLength: 100
      is_cover:
        type: array
        items:
          type: string
          description: 覆盖的环境变量名
          maxLength: 100
  ValidationVariablesImport:
    type: object
    description: 环境变量
    properties:
      result:
        type: boolean
        description: 校验结果
      reason:
        type: string
        description: 原因
      variables:
        type: array
        items:
          $ref: '#/definitions/ValidationVariableImport'
  ValidationVariableImport:
    type: object
    description: 环境变量
    properties:
      variableName:
        type: string
        description: 变量名称
      validateResult:
        type: string
        description: 检查结果
      variableValue:
        type: string
        description: 变量值
      variableType:
        type: string
        description: 类型
      isSecret:
        type: boolean
        description: 是否加密
