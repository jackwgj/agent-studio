swagger: '2.0'
info:
  version: v1
  title: agent-base内部接口
  description: agent-base模块涉及的对外访问接口
schemes:
  - https
host: localhost.com
basePath: /v1
tags:
  - name: KnowledgeBaseConnectionConfigManagement
    description: 知识库配置管理
  - name: KnowledgeBaseObsConfigManagement
    description: 知识库OBS配置管理
paths:
  /v2/{project_id}/agent-manager/knowledge-bases/configurations/default-connections:
    post:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 创建默认知识库配置
      description: 创建默认知识库配置
      operationId: CreateDefaultKbConnection
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: default_knowledge_repo_connection
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateDefaultKnowledgeBaseConnectionRequestBody'
          description: 创建默认知识库连接请求体
      responses:
        '200':
          description: 创建默认知识库连接响应体
          schema:
            $ref: '#/definitions/CreateDefaultKnowledgeBaseConnectionResponse'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 4
      
  /v2/{project_id}/agent-manager/knowledge-bases/configurations/default-connections/{kb_connection_id}:
    get:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 查询默认知识库连接详情
      description: 查询默认知识库连接详情
      operationId: ShowDefaultKnowledgeBaseConnection
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: kb_connection_id
          in: path
          required: true
          type: string
          description: 知识库连接id
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: 知识库
          schema:
            $ref: '#/definitions/ShowDefaultKnowledgeBaseConnectionDetailResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 6
      
    put:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 编辑默认知识库连接
      description: 编辑默认知识库连接
      operationId: UpdateDefaultKnowledgeBaseConnection
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: knowledge
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateDefaultKnowledgeBaseConnectionRequestBody'
          description: 编辑默认知识库请求体
        - name: kb_connection_id
          in: path
          required: true
          type: string
          description: 默认知识库连接id
          maxLength: 64
          minLength: 1
      responses:
        '200':
          description: 编辑第三方知识库响应体
          schema:
            $ref: '#/definitions/UpdateDefaultKnowledgeBaseConnectionResponse'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 5
      
  /v2/{project_id}/agent-manager/knowledge-bases/configurations/default-connectors:
    get:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 查询默认知识库连接器列表
      description: 查询默认知识库连接器
      operationId: ListDefaultKnowledgeBaseConnectors
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: offset
          in: query
          required: false
          description: 分页记录的起始位置偏移量,默认值0
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 10000
        - name: limit
          in: query
          required: false
          description: 每一页的数量,默认10
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: 知识库
          schema:
            $ref: '#/definitions/ListDefaultKnowledgeBaseConnectorsResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 6
      
  /v2/{project_id}/agent-manager/knowledge-bases/configurations/default-connections/test-connection:
    post:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 用于测试默认知识库连接是否正常
      description: 用于测试默认知识库连接是否正常
      operationId: TestDefaultKnowledgeBaseConnection
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: test_connection_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TestDefaultKnowledgeBaseConnectionRequestBody'
          description: 测试默认知识库连接请求体
      responses:
        '200':
          description: 测试默认知识库连接响应体
          schema:
            $ref: '#/definitions/TestDefaultKnowledgeBaseResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 4
      
  /v2/{project_id}/agent-manager/knowledge-bases/configurations/default-connections/{connection_id}/test-connection:
    post:
      tags:
        - KnowledgeBaseConnectionConfigManagement
      summary: 用于测试默认知识库连接是否正常
      description: 用于测试默认知识库连接是否正常
      operationId: TestDefaultKnowledgeBaseConnectionId
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: connection_id
          in: path
          type: string
          required: true
          description: 测试默认知识库连接Id
      responses:
        '200':
          description: 测试默认知识库连接响应体
          schema:
            $ref: '#/definitions/TestDefaultKnowledgeBaseResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 4
      
definitions:
  KnowledgeBaseConnectorDetail:
    type: object
    description: 第三方知识库连接器信息
    properties:
      id:
        type: string
        description: 知识库连接器id
      name:
        type: string
        description: 连接器名称
      icon:
        type: string
        description: 连接器图标
      description:
        type: string
        description: 连接器描述
      deploy_mode:
        type: string
        description: 连接器部署模式
      help_text:
        type: string
        description: 帮助文档
      param_definition:
        type: array
        description: 连接器参数定义
        minItems: 0
        maxItems: 10
        items:
          $ref: '#/definitions/ParamDefinitionInfo'
      workspace_id:
        type: string
        description: 工作空间id
        minLength: 0
        maxLength: 100
      domain_name:
        type: string
        description: 租户名称
        minLength: 0
        maxLength: 100
      create_user_id:
        type: string
        description: 创建用户ID
        minLength: 0
        maxLength: 100
      create_user_name:
        type: string
        description: 创建用户名称
        minLength: 0
        maxLength: 100
      create_time:
        type: integer
        format: int64
        description: 创建时间
        minimum: 0
        maximum: 9223372036854775807
      update_user_id:
        type: string
        description: 更新用户ID
        minLength: 0
        maxLength: 100
      update_user_name:
        type: string
        description: 更新用户名称
        minLength: 0
        maxLength: 100
      update_time:
        type: integer
        format: int64
        description: 创建时间
        minimum: 0
        maximum: 9223372036854775807
  ListDefaultKnowledgeBaseConnectorsResponseBody:
    type: object
    description: 查询默认知识库连接器响应体
    properties:
      total:
        type: integer
        format: int64
        example: 22
        description: 总计
        minimum: 0
        maximum: 10000
      connectors:
        type: array
        description: 知识库列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/KnowledgeBaseConnectorDetail'
  ParamDefinitionInfo:
    type: object
    description: 连接器参数定义详情
    properties:
      code:
        type: string
        description: 参数
      name:
        type: string
        description: 参数名称
      need:
        type: string
        description: 是否必填
      type:
        type: string
        description: 参数类型
        enum:
          - STRING
          - SECRET
          - BOOLEAN
          - FILE
      remark:
        type: string
        description: 参数说明
        maxLength: 2000
      pattern:
        type: string
        description: 参数格式
        maxLength: 200
  TestDefaultKnowledgeBaseConnectionRequestBody:
    type: object
    description: 第三方知识库连接测试请求体
    required:
      - connector_id
      - params
    properties:
      connector_id:
        type: string
        description: 使用的连接器ID
        minLength: 0
        maxLength: 50
      params:
        type: array
        description: 参数
        items:
          $ref: '#/definitions/ConnectionParamInfo'
        minItems: 1
        maxItems: 10
  TestDefaultKnowledgeBaseResponseBody:
    type: object
    description: 默认知识库测试连接请求体
    properties:
      result:
        type: boolean
        description: 连接是否成功
  CommonBatchDeleteRequestBody:
    type: object
    description: 批量删除请求体
    properties:
      ids:
        type: array
        x-maxLength: 10
        items:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 64
        maxItems: 10
        minimum: 1
  CommonBatchDeleteResponse:
    type: object
    description: 批量删除响应体
    properties:
      success_ids:
        type: array
        items:
          minLength: 1
          maxLength: 10
          type: string
      failed_ids:
        type: array
        items:
          minLength: 1
          maxLength: 10
          type: string
  UpdateDefaultKnowledgeBaseConnectionResponse:
    type: object
    description: 修改默认知识库连接响应体
    properties:
      id:
        type: string
        description: 知识库连接ID
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
  UpdateDefaultKnowledgeBaseConnectionRequestBody:
    type: object
    description: 修改默认知识库连接的请求体
    properties:
      changed:
        type: boolean
        description: 是否修改
        default: false
      connector_id:
        type: string
        description: 知识库连接器id
      params:
        type: array
        items:
          $ref: '#/definitions/ConnectionParamInfo'
  ListDefaultKnowledgeBaseConnectionsResponse:
    type: object
    properties:
      total:
        type: integer
        format: int64
        example: 22
        description: 总计
        minimum: 0
        maximum: 10000
      items:
        type: array
        description: 默认知识库连接列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/DefaultKnowledgeBaseConnectionListItem'
  DefaultKnowledgeBaseConnectionListItem:
    properties:
      id:
        type: string
        description: 默认知识库连接id
      connector_id:
        type: string
        description: 知识库连接器id
      description:
        type: string
        description: 描述
      domain_name:
        type: string
        description: 租户名称
        minLength: 0
        maxLength: 100
      create_user_id:
        type: string
        description: 创建用户ID
        minLength: 0
        maxLength: 100
      create_user_name:
        type: string
        description: 创建用户名称
        minLength: 0
        maxLength: 100
      create_time:
        type: integer
        format: int64
        description: 创建时间
        minimum: 0
        maximum: 9223372036854775807
      update_user_id:
        type: string
        description: 更新用户ID
        minLength: 0
        maxLength: 100
      update_user_name:
        type: string
        description: 更新用户名称
        minLength: 0
        maxLength: 100
      update_time:
        type: integer
        format: int64
        description: 创建时间
        minimum: 0
        maximum: 9223372036854775807
  DefaultKnowledgeBaseConnectionDetail:
    type: object
    description: 默认知识库连接详情
    properties:
      id:
        type: string
        description: 知识库连接id
      connector_id:
        type: string
        description: 知识库连接器id
      connector_name:
        type: string
        description: 知识库连接器名称
      params:
        type: array
        description: 连接参数
        items:
          $ref: '#/definitions/ConnectionParamInfo'
      workspace_id:
        type: string
        description: 工作空间id
        minLength: 0
        maxLength: 100
      domain_name:
        type: string
        description: 租户名称
        minLength: 0
        maxLength: 100
      create_user_id:
        type: string
        description: 创建用户ID
        minLength: 0
        maxLength: 100
      create_user_name:
        type: string
        description: 创建用户名称
        minLength: 0
        maxLength: 100
      create_time:
        type: integer
        format: int64
        description: 创建时间
        minimum: 0
        maximum: 9223372036854775807
      update_time:
        type: integer
        format: int64
        description: 更新时间
        minimum: 0
        maximum: 9223372036854775807
      update_user_id:
        type: string
        description: 更新用户ID
        minLength: 0
        maxLength: 100
      update_user_name:
        type: string
        description: 更新用户名称
        minLength: 0
        maxLength: 100
  ShowDefaultKnowledgeBaseConnectionDetailResponseBody:
    type: object
    description: 查询m默认知识库连接详情返回体
    properties:
      knowledge_base_connection_detail:
        $ref: '#/definitions/DefaultKnowledgeBaseConnectionDetail'
  CreateDefaultKnowledgeBaseConnectionResponse:
    type: object
    description: 创建默认知识库连接响应体
    properties:
      id:
        type: string
        description: 默认知识库连接id
  CreateDefaultKnowledgeBaseConnectionRequestBody:
    type: object
    properties:
      connector_id:
        type: string
        description: 第三方知识库连接器id
        maxLength: 128
      params:
        type: array
        description: 参数列表
        minItems: 1
        maxItems: 10
        items:
          $ref: '#/definitions/ConnectionParamInfo'
  ConnectionParamInfo:
    type: object
    properties:
      code:
        type: string
        description: 参数名
        example: user
        minLength: 0
        maxLength: 100
      value:
        type: string
        description: 参数值
        minLength: 0
        maxLength: 1000
  KnowledgeBaseObsConfigResp:
    description: 知识库OBS配置详情。
    type: object
    properties:
      id:
        type: string
        description: OBS配置ID。
      obs_bucket_name:
        type: string
        description: OBS桶名。
      obs_input_directory:
        type: string
        description: OBS路径。
  CreateKnowledgeBaseObsConfigReq:
    description: 创建知识库OBS配置请求体。
    type: object
    required:
      - obs_bucket_name
      - obs_input_directory
    properties:
      obs_bucket_name:
        type: string
        description: OBS桶名。
      obs_input_directory:
        type: string
        description: OBS路径。
  CreateKnowledgeBaseObsConfigResp:
    description: 创建知识库OBS配置返回体。
    type: object
    properties:
      id:
        type: string
        description: OBS配置ID。
  KnowledgeBaseObsConfigExecuteReq:
    description: OBS配置执行动作。
    type: object
    properties:
      action:
        type: string
        description: |-
          OBS配置执行动作：
          - UPLOAD：上传
        enum:
          - UPLOAD
  KnowledgeBaseObsConfigExecuteResp:
    description: OBS配置执行返回体。
    type: object
    properties:
      id:
        type: string
        description: 执行记录ID。
  KnowledgeBaseObsConfigExecuteRecordsResp:
    description: OBS执行记录列表。
    type: object
    properties:
      data:
        type: array
        items:
          $ref: '#/definitions/KnowledgeBaseObsConfigExecuteRecord'
      total:
        type: integer
        format: int64
        description: 总数。
  KnowledgeBaseObsConfigExecuteRecord:
    description: OBS执行记录。
    type: object
    properties:
      id:
        type: string
        description: 日志ID。
      status:
        type: string
        description: |-
          执行状态：
          - RUNNING：执行中
          - FINISHED：执行完成
          - FAILED：执行失败
        enum:
          - RUNNING
          - FINISHED
          - FAILED
      start_time:
        type: integer
        format: int64
        description: 开始时间戳。
      end_time:
        type: integer
        format: int64
        description: 结束时间戳。
      log_detail:
        type: string
        description: 执行日志。
  ObsBucketObjectsReq:
    type: object
    properties:
      bucketName:
        type: string
        description: ''
        maxLength: 100
      dir:
        type: string
        description: ''
        maxLength: 1000
parameters:
  projectId:
    name: project_id
    in: path
    description: 租户项目ID。
    required: true
    type: string
    pattern: ^[a-zA-Z0-9_-]{1,40}$
  workspaceId:
    name: workspace_id
    description: 项目空间ID。
    in: query
    required: true
    type: string
  offset:
    name: offset
    in: query
    required: false
    description: 偏移量
    default: 0
    minimum: 0
    maximum: 10000
    type: integer
    format: int32
  limit:
    name: limit
    in: query
    required: false
    description: 最大返回数量
    default: 10
    minimum: 1
    maximum: 200
    type: integer
    format: int32
