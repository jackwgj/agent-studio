swagger: '2.0'
info:
  version: v1
  title: ApplicationTitle
  description: GroupDesc
schemes:
  - https
host: localhost.com
basePath: /
tags:
  - name: Variable
    description: 变量集接口
  - name: TaskManager
  - name: EvaluationTask
    description: 评估任务接口
  - name: ModelManager
  - name: TagManager
  - name: EvaluationResult
  - name: Prompt
  - name: PromptLibrary
  - name: Dataset
  - name: Obs
paths:
  /v1/{project_id}/agent-builder/prompt-engineering/template/sample/download:
    post:
      tags:
        - PromptLibrary
      description: 导出模板样例
      operationId: DownloadPromptSampleTemplate
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
        - application/excel
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
      responses:
        '200':
          description: success
          schema:
            type: string

  /v1/{project_id}/agent-builder/prompt/tag/list:
    get:
      tags:
        - TagManager
      operationId: ListTags
      produces:
        - application/json
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: limit
          in: query
          required: true
          description: 数据量
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 1000
        - name: offset
          in: query
          required: true
          description: 偏移量
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 100000
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/TagListVo'
  /v1/{project_id}/agent-builder/prompt-engineering/template/save:
    post:
      tags:
        - PromptLibrary
      description: 保存模板
      operationId: SavePromptTemplate
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: pe_prompt_template
          in: body
          required: true
          description: 创建模板请求体
          schema:
            $ref: '#/definitions/PePromptTemplateDto'
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
      responses:
        '200':
          description: ''
          schema:
            type: string
  /v1/{project_id}/agent-builder/prompt-engineering/template/list:
    post:
      tags:
        - PromptLibrary
      description: 查询提示词
      operationId: ListPromptTemplates
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: false
          schema:
            $ref: '#/definitions/QueryTemplateCondition'
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
        - name: category
          in: query
          required: false
          type: string
          description: 分类
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/PePromptTemplateListVo'

  /v2/{project_id}/agent-builder/prompt-engineering/template/download:
    post:
      tags:
        - PromptLibrary
      description: 导出模板
      operationId: DownloadPromptTemplateV2
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
        - application/excel
      parameters:
        -   name: project_id
            in: path
            required: true
            type: string
        -   name: template_ids
            in: body
            required: false
            description: Template 模板 ID
            schema:
              type: array
              minItems: 0
              maxItems: 500
              items:
                type: string
        -   name: workspace_id
            in: query
            required: true
            type: string
            description: 工作空间ID
      responses:
        '200':
          description: success
          schema:
            type: string

  /v2/{project_id}/agent-builder/prompt-engineering/template/import:
    post:
      tags:
        - PromptLibrary
      description: 导入模板
      operationId: ImportPromptTemplateV2
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: file
          in: formData
          required: true
          type: file
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: string

  /v1/{project_id}/agent-builder/prompt-engineering/template/delete/{id}:
    delete:
      tags:
        - PromptLibrary
      description: 删除模板
      operationId: DeletePromptTemplate
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: id
          in: path
          required: true
          type: string
          pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 工作空间ID
      responses:
        '200':
          description: ''
          schema:
            type: string

  /v1/{project_id}/agent-builder/prompt/industry/list:
    get:
      tags:
        - IndustryManager
      operationId: ListIndustry
      produces:
        - application/json
      x-apigateway-request-type: Private
      x-is-registered: 'Y'
      x-support-sdk: 'Y'
      x-apiexplorer-hide: 'N'
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: workspace_id
          in: query
          required: false
          type: string
          description: 工作空间ID
        - name: library_type
          in: query
          required: false
          type: string
          description: 组件类型
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              $ref: '#/definitions/IndustryVo'
definitions:
  FileInfoVo:
    description: 图片上传包装类
    required:
      - file_id
      - tempUrl
    properties:
      file_id:
        type: string
        description: 图片名
      tempUrl:
        type: string
        description: 临时访问路径
  PeEvaluationTaskDto:
    description: 评估任务DTO
    required:
      - name
      - task_id
      - method
      - test_set_id
      - prompt_ids
    properties:
      name:
        type: string
        description: 评估任务名称
        pattern: ^[\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5\w-]{0,30}[\u4e00-\u9fa5a-zA-Z0-9]$
      description:
        type: string
        description: 评估任务描述
        minLength: 0
        maxLength: 100
      task_id:
        type: string
        description: 工程任务id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      method:
        type: string
        description: 评估方法
        pattern: similarity|matching
      test_set_id:
        type: string
        description: 测试数据集id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      prompt_ids:
        type: array
        description: 模板列表id
        items:
          type: string
          pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        minItems: 0
        maxItems: 9
      regular_expression:
        type: string
        description: 评估正则表达式
        minLength: 0
        maxLength: 64
      eval_model_config:
        type: object
        description: 评估模型
        $ref: '#/definitions/ModelConfig'
    type: object
  PeEvaluationTaskVo:
    description: 评估任务Vo
    properties:
      id:
        type: string
        description: 评估任务UUID
      name:
        type: string
        description: 评估任务名称
      description:
        type: string
        description: 评估任务描述
      method:
        type: string
        description: 评估方法
      regular_expression:
        type: string
        description: 评估正则表达式
      task_id:
        type: string
        description: 工程任务id
      test_set_id:
        type: string
        description: 测试数据集id
      test_set_name:
        type: string
        description: 测试数据集名称
      case_num:
        type: integer
        description: 测试数据个数
      created_on:
        type: string
        description: 创建评估任务时间
      updated_on:
        type: string
        description: 更新评估任务时间
      status:
        type: string
        description: 评估任务状态
      prompt_list:
        type: array
        minItems: 0
        maxItems: 500
        description: 模板列表
        items:
          $ref: '#/definitions/PePromptVo'
      prompt_best_name:
        type: string
        description: 最佳候选名称
      prompt_num:
        type: integer
        description: 候选数量
      best_score:
        type: integer
        description: 最佳评分
      creator:
        type: string
        description: 创建任务者名称
    type: object
  EvaluationTaskListVo:
    description: 评估用例记录信息（分页）
    required:
      - total_page
      - count
      - has_next_page
    properties:
      data:
        type: array
        minItems: 0
        maxItems: 500
        description: 标签信息列表
        items:
          $ref: '#/definitions/PeEvaluationTaskVo'
      total_page:
        type: integer
        description: 总页数
      count:
        type: integer
        format: int64
        description: 数据总条数
      has_next_page:
        type: boolean
        default: false
        description: 是否有下一页
    type: object
  PeOptimizationTaskDto:
    description: 优化任务DTO
    required:
      - task_id
      - name
      - description
      - prompt_ids
      - test_set_id
      - num_iter
      - model_info
    properties:
      task_id:
        type: string
        description: 工程任务id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      name:
        type: string
        description: 优化任务名称
        pattern: ^[\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5\w-]{0,30}[\u4e00-\u9fa5a-zA-Z0-9]$
      description:
        type: string
        description: 优化任务描述
        minLength: 0
        maxLength: 100
      type:
        type: string
        description: 优化任务类型
      prompt_ids:
        type: array
        description: 模板列表id
        items:
          type: string
          pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        minItems: 0
        maxItems: 9
      test_set_id:
        type: string
        description: 用例集ID
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      model_config:
        type: object
        description: 优化模型
        $ref: '#/definitions/ModelConfig'
      assistant_config:
        type: object
        description: 评分模型
        $ref: '#/definitions/ModelConfig'
      num_iter:
        type: integer
        format: int32
        description: 优化的迭代轮数
        default: 3
        minimum: 1
        maximum: 5
    type: object
  ModelInfo:
    description: 模型信息
    required:
      - type
      - name
      - url
    properties:
      type:
        type: string
        description: 模型类型
      name:
        type: string
        description: 模型名称
      url:
        type: string
        description: 模型url
      token:
        type: string
        description: 模型token
    type: object
  PeOptimizationTaskVo:
    description: 优化任务Vo
    properties:
      id:
        type: string
        description: 优化任务UUID
      name:
        type: string
        description: 优化任务名称
      description:
        type: string
        description: 优化任务描述
      type:
        type: string
        description: 优化任务类型
      jiuwen_task_id:
        type: string
        description: 九问任务ID
      task_id:
        type: string
        description: 工程任务id
      test_set_id:
        type: string
        description: 用例集ID
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      model_config:
        type: object
        description: 优化模型
        $ref: '#/definitions/ModelConfig'
      assistant_config:
        type: object
        description: 评分模型
        $ref: '#/definitions/ModelConfig'
      num_iter:
        type: integer
        description: 优化的迭代轮数
      status:
        type: string
        description: 优化任务状态
      progress_rate:
        type: number
        format: double
        description: 当前时刻优化进度
      best_prompt:
        type: string
        description: 当前时刻优化后的模板
      error_msg:
        type: string
        description: 错误消息
      created_on:
        type: string
        description: 创建优化任务时间
      creator:
        type: string
        description: 创建任务者名称
      updated_on:
        type: string
        description: 更新优化任务时间
      running_on:
        type: string
        description: 启动优化任务时间
      prompts:
        type: array
        items:
          $ref: '#/definitions/PePromptVo'
    type: object
  OptimizationTaskListVo:
    description: 优化用例记录信息（分页）
    required:
      - total_page
      - count
      - has_next_page
    properties:
      data:
        type: array
        minItems: 0
        maxItems: 500
        description: 标签信息列表
        items:
          $ref: '#/definitions/PeOptimizationTaskVo'
      total_page:
        type: integer
        description: 总页数
      count:
        type: integer
        format: int64
        description: 数据总条数
      failed_count:
        type: integer
        format: int64
        description: 优化失败
      finished_count:
        type: integer
        format: int64
        description: 已完成
      optimizing_count:
        type: integer
        format: int64
        description: 优化中
      has_next_page:
        type: boolean
        default: false
        description: 是否有下一页
    type: object
  TestSetInfo:
    type: object
    description: 测试数据集相关信息
    properties:
      id:
        type: string
        description: 测试数据集id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      name:
        type: string
        description: 测试用例集名称
        minLength: 0
        maxLength: 512
        example: comments_test_data_set
        pattern: (^$)|^[\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5\w-]{0,30}[\u4e00-\u9fa5a-zA-Z0-9]$
      test_list:
        type: array
        minItems: 0
        maxItems: 500
        items:
          $ref: '#/definitions/TestInfo'
  TestInfo:
    type: object
    description: 测试用例相关信息
    required:
      - question
      - standard_answer
    properties:
      id:
        type: string
        description: 测试用例id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      question:
        type: string
        description: 包含key的字符串
        minLength: 0
        maxLength: 512
      standard_answer:
        type: string
        description: 标准答案
        minLength: 0
        maxLength: 512
      set_id:
        type: string
        description: 测试数据集id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  TagDto:
    type: object
    properties:
      id:
        type: string
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      name:
        type: string
        description: 标签名称
        pattern: ^[\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5\w-]{0,30}[\u4e00-\u9fa5a-zA-Z0-9]$
      name_en:
        type: string
        description: 标签英文名称
  TagListVo:
    type: object
    properties:
      total_page:
        type: integer
      data:
        type: array
        items:
          $ref: '#/definitions/TagVo'
      count:
        type: integer
        format: int64
      has_next_page:
        type: boolean
        default: false
  TagVo:
    type: object
    properties:
      id:
        type: string
        description: 标签UUID
      name:
        type: string
        description: 标签名称
      name_en:
        type: string
        description: 标签英文名称
      created_on:
        type: string
        format: date-time
        description: 创建时间
      updated_on:
        type: string
        format: date-time
  TaskDto:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
        description: 任务名称
        pattern: ^[\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5\w-]{0,30}[\u4e00-\u9fa5a-zA-Z0-9]$
      description:
        type: string
        description: 任务描述信息
        minLength: 0
        maxLength: 100
      tag_ids:
        type: array
        minItems: 0
        maxItems: 500
        description: 任务绑定的标签ID
        items:
          type: string
      industry_id:
        type: string
        description: 行业id
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  TaskListVo:
    type: object
    properties:
      total_page:
        type: integer
        description: 总页数
      data:
        type: array
        description: 详细数据
        items:
          $ref: '#/definitions/TaskVo'
      count:
        type: integer
        format: int64
        description: 数据总条数
      has_next_page:
        type: boolean
        default: false
        description: 是否有下一页
  TaskVo:
    type: object
    properties:
      id:
        type: string
        description: 任务UUID
      name:
        type: string
        description: 任务名称
      description:
        type: string
        description: 任务描述
      creator:
        type: string
        description: 任务创建者
      created_on:
        type: string
        format: date-time
        description: 任务创建时间
      updater:
        type: string
        description: 任务更新者
      updated_on:
        type: string
        format: date-time
        description: 任务更新时间
      tag_list:
        type: array
        description: 绑定的标签相关信息
        items:
          $ref: '#/definitions/TagVo'
      iterationNum:
        type: integer
        description: 候选模板的迭代次数
      industry:
        type: object
        description: 行业
        $ref: '#/definitions/IndustryVo'
  PromptBody:
    type: object
    description: 调优所需的prompt信息
    required:
      - model
      - source
      - question
      - task_id
      - model_config
    properties:
      task_id:
        type: string
        description: 工程任务id
        pattern: (^$)|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      source:
        type: string
        description: 数据来源，用于分类
        pattern: PLAYGROUND|EXPERIMENT|CANDIDATE|HORIZONTAL|NO_SOURCE|PRESET
      question:
        type: string
        description: prompt模板，带占位符
        minLength: 0
        maxLength: 10000
      variables:
        type: array
        items:
          $ref: '#/definitions/VariableDto'
        description: 调优使用的变量
        minItems: 0
        maxItems: 20
      model:
        type: string
        description: 使用的模型及版本信息
        minLength: 0
        maxLength: 1000
      model_config:
        $ref: '#/definitions/ModelConfig'
      model_type:
        type: string
      third_model_type:
        type: string
      file_id:
        type: string
  TemplateBody:
    type: object
    description: 调用模型所需要的prompt信息
    required:
      - question
      - model_config
    properties:
      question:
        type: string
        description: 问题
        minLength: 0
        maxLength: 4000
      model_config:
        type: object
        description: 生成模型
        $ref: '#/definitions/ModelConfig'
  ModelConfig:
    type: object
    description: agentBuilder模型参数配置信息
    required:
      - deployment_id
      - project_id
    properties:
      user:
        type: string
        minLength: 0
        maxLength: 255
      temperature:
        type: number
        format: double
        description: 温度超参数，0~1，默认0.5
        minimum: 0
        maximum: 1
      top_p:
        type: number
        format: double
        description: 抽样概率值，取值范围(0,1]
        minimum: 0
        maximum: 1
        exclusiveMinimum: true
      max_tokens:
        type: integer
        description: 用于控制聊天回复的长度和质量。
