swagger: '2.0'
info:
  version: v1
  title: agent manager API
  description: agent manager API
schemes:
  - https
host: localhost.com
basePath: /
tags:
  - name: MemoryRepoManagement

paths:
  /v2/{project_id}/agent-manager/memory-repositories:
    get:
      tags:
        - MemoryRepoManagement
      summary: 获取记忆库列表
      description: 获取记忆库列表
      operationId: ListMemoryRepositories
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
        - name: offset
          in: query
          required: false
          description: 分页记录的起始位置偏移量,默认值0
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 10000
        - name: limit
          in: query
          required: false
          description: 每一页的数量,默认10
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
        - name: name
          in: query
          required: false
          description: 记忆库名称
          type: string
          minLength: 1
          maxLength: 50
        - name: ids
          in: query
          required: false
          type: array
          items:
            type: string
      responses:
        '200':
          description: 记忆库列表
          schema:
            $ref: '#/definitions/ListMemoryReposResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 3
    post:
      tags:
        - MemoryRepoManagement
      summary: 创建一个记忆库
      description: 创建一个记忆库
      operationId: CreateMemoryRepo
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
        - name: CreateMemoryRepoRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateMemoryRepoRequestBody'
          description: 创建记忆库请求体
      responses:
        '200':
          description: 创建记忆库响应体
          schema:
            $ref: '#/definitions/CreateMemoryRepoResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 4
  /v2/{project_id}/agent-manager/memory-repositories/{memory_repo_id}:
    put:
      tags:
        - MemoryRepoManagement
      summary: 修改一个记忆库
      description: 修改一个记忆库，包括：展示名称、描述、高级设置
      operationId: ModifyMemoryRepo
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: ModifyMemoryRepoRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModifyMemoryRepoRequestBody'
          description: 修改记忆库请求体
        - name: memory_repo_id
          in: path
          required: true
          type: string
          description: 记忆库id
          maxLength: 64
          minLength: 1
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
      responses:
        '200':
          description: 修改记忆库响应体
          schema:
            $ref: '#/definitions/ModifyMemoryRepoResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 5
    get:
      tags:
        - MemoryRepoManagement
      summary: 查询一个记忆库详情
      description: 查询一个记忆库详情
      operationId: ShowMemoryRepo
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: memory_repo_id
          in: path
          required: true
          type: string
          description: 记忆库id
          minLength: 1
          maxLength: 64
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
      responses:
        '200':
          description: 查询记忆库详情响应体
          schema:
            $ref: '#/definitions/ShowMemoryRepoResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 6
    delete:
      tags:
        - MemoryRepoManagement
      summary: 删除一个记忆库
      description: 删除一个记忆库
      operationId: DeleteMemoryRepo
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: memory_repo_id
          in: path
          required: true
          type: string
          description: 记忆库id
          minLength: 1
          maxLength: 64
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
      responses:
        '200':
          description: 删除记忆库响应体
          schema:
            $ref: '#/definitions/DeleteMemoryRepoResponseBody'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 7
definitions:
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
  ModifyMemoryRepoRequestBody:
    type: object
    description: 修改记忆库请求体
    required:
      - name
    properties:
      name:
        type: string
        description: 记忆库展示名称
        example: 用户喜好记忆库
        pattern: ^[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！!](?:[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！! ]*[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！!])?$
        maxLength: 50
        minLength: 1
      description:
        type: string
        example: 用户喜好记忆库，用来识别和检索用户的爱好信息
        description: 记忆库的描述，尽可能的准确简短描述记忆库的用途。
        minLength: 0
        maxLength: 1000
      icon:
        type: string
        description: 智能体图标。
      long_term_memory_strategies:
        type: array
        description: 长期记忆策略列表
        minItems: 0
        maxItems: 20
        items:
          $ref: '#/definitions/LongTermMemoryStrategy'
  CreateMemoryRepoRequestBody:
    type: object
    description: 创建记忆库请求体
    required:
      - name
    properties:
      name:
        type: string
        description: 记忆库展示名称
        example: 用户喜好记忆库
        maxLength: 50
        minLength: 1
        pattern: ^[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！!](?:[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！! ]*[\u4e00-\u9fa5a-zA-Z0-9_\-（）()！!])?$
      description:
        type: string
        example: 用户喜好记忆库，用来识别和检索用户的爱好信息
        description: 记忆库的描述，尽可能的准确简短描述记忆库的用途。
        minLength: 0
        maxLength: 1000
      icon:
        type: string
        description: 智能体图标。
      long_term_memory_strategies:
        type: array
        description: 长期记忆策略列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/LongTermMemoryStrategy'
  LongTermMemoryStrategy:
    type: object
    description: 长期记忆抽取策略
    properties:
      type:
        type: string
        description: 策略类型，semantic_memory-语义记忆，user_profile-用户偏好
        enum:
          - semantic_memory
          - user_profile
        example: semantic_memory
      prompt:
        type: string
        description: 记忆策略提示词
        minLength: 0
        maxLength: 1000
  CreateMemoryRepoResponseBody:
    type: object
    description: 创建记忆库响应体
    properties:
      memory_repo_id:
        type: string
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        description: 记忆库ID
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
  ModifyMemoryRepoResponseBody:
    type: object
    description: 修改记忆库响应体
    properties:
      memory_repo_id:
        type: string
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        description: 记忆库ID
        maxLength: 64
  ShowMemoryRepoResponseBody:
    type: object
    description: 记忆库，包含若干文档
    properties:
      memory_repo_id:
        type: string
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        description: 记忆库ID
        minLength: 1
        maxLength: 64
      name:
        type: string
        description: 记忆库展示名称
        example: 发票报销流程记忆库
        minLength: 1
        maxLength: 64
      description:
        type: string
        example: 发票报销流程文档记忆库，需要检索发票报销流程相关记忆时使用
        description: 记忆库的描述，尽可能的准确简短描述记忆库的用途。
      icon:
        type: string
        description: 智能体图标。
      long_term_memory_strategies:
        type: array
        description: 长期记忆策略列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/LongTermMemoryStrategy'
      created_user_id:
        type: string
        example: 张三
        description: 创建人ID
        minLength: 0
        maxLength: 100
      created_user_name:
        type: string
        example: 张三
        description: 创建人名称
        minLength: 0
        maxLength: 100
      create_time:
        type: string
        format: date-time
        example: '1768459839465'
        description: 创建记忆库时间戳（毫秒级）
        minimum: 0
        maximum: 253402214400000
      last_update_user_id:
        type: string
        example: 张三
        description: 更新人ID
        minLength: 0
        maxLength: 100
      last_update_user_name:
        type: string
        example: 张三
        description: 更新人名称
        minLength: 0
        maxLength: 100
      update_time:
        type: string
        format: date-time
        example: '1768460997122'
        description: 更新记忆库的时间戳（毫秒级）
        minimum: 0
        maximum: 253402214400000
  ListMemoryReposResponseBody:
    type: object
    properties:
      total:
        type: integer
        format: int64
        example: 22
        description: 总计
        minimum: 0
        maximum: 10000
      items:
        type: array
        description: 记忆库列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/MemoryRepoListItem'
  MemoryRepoListItem:
    type: object
    description: 记忆库列表中的信息
    properties:
      memory_repo_id:
        type: string
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        description: 记忆库ID
        minLength: 0
        maxLength: 64
      workspace_id:
        type: string
        description: 空间ID
        pattern: ^[a-zA-Z0-9_()\-]+$
        maxLength: 64
      name:
        type: string
        description: 记忆库展示名称
        example: 用户喜好记忆库
        minLength: 0
        maxLength: 64
      description:
        type: string
        example: 用户喜好记忆库，用来识别和检索用户的爱好信息
        description: 记忆库的描述，尽可能的准确简短描述记忆库的用途。
      icon:
        type: string
        description: 智能体图标。
      long_term_memory_strategies:
        type: array
        description: 长期记忆策略列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/LongTermMemoryStrategy'
      created_user_id:
        type: string
        example: 张三
        description: 创建人ID
        minLength: 0
        maxLength: 100
      created_user_name:
        type: string
        example: 张三
        description: 创建人名称
        minLength: 0
        maxLength: 100
      create_time:
        type: string
        format: date-time
        example: '1768459839465'
        description: 创建记忆库时间戳（毫秒级）
        minimum: 0
        maximum: 253402214400000
      last_update_user_id:
        type: string
        example: 张三
        description: 更新人ID
        minLength: 0
        maxLength: 100
      last_update_user_name:
        type: string
        example: 张三
        description: 更新人名称
        minLength: 0
        maxLength: 100
      update_time:
        type: string
        format: date-time
        example: '1768460997122'
        description: 更新记忆库的时间戳（毫秒级）
        minimum: 0
        maximum: 253402214400000
  DeleteMemoryRepoResponseBody:
    type: object
    properties:
      memory_repo_id:
        type: string
        description: 删除对象id
        minLength: 0
        maxLength: 64