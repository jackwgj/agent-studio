swagger: '2.0'
info:
  version: v1
  title: model service API
  description: model service API
schemes:
  - https
host: localhost.com
basePath: /
tags:
  - name: ProviderMgmt
  - name: ProviderAuthMgmt
  - name: ModelServiceMgmt
  - name: RouterStrategyMgmt

paths:
  /v1/{project_id}/model-manager/model-test/status:
    post:
      tags:
        - ModelServiceMgmt
      description: 更新模型调测状态
      operationId: UpdateModelStatus
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: model
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModelStatusReq'
      responses:
        '200':
          description: 成功

  /v1/{project_id}/model-manager/platform/providers:
    get:
      tags:
        - ProviderMgmt
      description: 查询平台预置模型服务供应商列表
      operationId: QueryPlatformProviders
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: query
          in: query
          type: string
          required: false
          maxLength: 64
          pattern: ^[\u4e00-\u9fa5a-zA-Z0-9_ /:.|\\-]{1,64}$
        - name: page_num
          in: query
          type: integer
          format: int32
          required: false
          default: 1
          minimum: 1
        - name: page_size
          in: query
          type: integer
          format: int32
          required: false
          default: 12
          minimum: 1
          maximum: 500
        - name: auth_config_status
          in: query
          type: string
          pattern: (available|no_exist|part_available)
          required: false
        - name: model_type
          in: query
          type: string
          pattern: (LLM|Text-Embedding|RERANK|TEXT-TO-IMAGE|IMAGE-TO-TEXT|AUDIO-TO-TEXT|TEXT-TO-AUDIO|TEXT-IMAGE-EMBEDDING)
          required: false
        - name: model_name
          in: query
          type: string
          pattern: '^[\u4e00-\u9fa5a-zA-Z0-9](?:[\u4e00-\u9fa5a-zA-Z0-9_.\\/:|\ -]{0,62}[\u4e00-\u9fa5a-zA-Z0-9_-])?$'
        - name: id
          in: query
          type: string
          maxLength: 80
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: functioncall
          in: query
          type: boolean

      responses:
        '200':
          description: 模型服务供应商列表
          schema:
            $ref: '#/definitions/ModelServiceProviderListRsp'


  /v1/{project_id}/model-manager/platform/providers/{id}:
    get:
      tags:
        - ProviderMgmt
      description: 查询平台预置模型服务供应详情
      operationId: PlatformModelServiceProviderDetail
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: id
          in: path
          required: true
          type: string
          maxLength: 80
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
      responses:
        '200':
          description: 模型服务供应商
          schema:
            $ref: '#/definitions/ModelServiceProviderRsp'


  /v1/{project_id}/model-manager/integration/providers:
    get:
      tags:
        - ProviderMgmt
      description: 查询用户接入模型服务供应商列表
      operationId: QueryUserProviders
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: query
          in: query
          type: string
          required: false
          maxLength: 64
          pattern: ^[\u4e00-\u9fa5a-zA-Z0-9_ :./\\|-]{1,64}$
        - name: page_num
          in: query
          type: integer
          format: int32
          required: false
          default: 1
          minimum: 1
        - name: page_size
          in: query
          type: integer
          format: int32
          required: false
          default: 12
          minimum: 1
          maximum: 500
        - name: auth_config_status
          in: query
          type: string
          pattern: (available|no_exist|part_available)
          required: false
        - name: model_type
          in: query
          type: string
          pattern: (LLM|Text-Embedding|RERANK|TEXT-TO-IMAGE|IMAGE-TO-TEXT|AUDIO-TO-TEXT|TEXT-TO-AUDIO|TEXT-IMAGE-EMBEDDING)
          required: false
        - name: model_name
          in: query
          type: string
          maxLength: 64
          pattern: '^[\u4e00-\u9fa5a-zA-Z0-9](?:[\u4e00-\u9fa5a-zA-Z0-9_.\\/:|\ -]{0,62}[\u4e00-\u9fa5a-zA-Z0-9_-])?$'
        - name: id
          in: query
          type: string
          maxLength: 80
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: functioncall
          in: query
          type: boolean

      responses:
        '200':
          description: 模型服务供应商列表
          schema:
            $ref: '#/definitions/ModelServiceProviderListRsp'

    post:
      tags:
        - ProviderMgmt
      description: 用户接入模型服务供应商列
      operationId: CreateModelServiceProviders
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: provider
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModelServiceProviderReq'

      responses:
        '200':
          description: 模型服务供应商列表
          schema:
            type: string

  /v1/{project_id}/agent-manager/integration/providers/auth-info/{id}:
      put:
        tags:
          - ProviderMgmt
        description: 更新供应商权鉴信息
        operationId: UpdateModelServiceProviderAuthInfo
        consumes:
          - application/json
        produces:
          - application/json
        parameters:
          - name: project_id
            in: path
            required: true
            type: string
            pattern: ^[a-zA-Z0-9_-]{1,40}$
          - name: workspace_id
            in: query
            required: true
            type: string
            pattern: ^[a-zA-Z0-9_()\-]{1,40}$
          - name: id
            in: path
            required: true
            type: string
            pattern: ^[a-zA-Z0-9_-]{1,80}$
          - name: available_check
            type: boolean
            required: false
            in: query
          - name: provider
            in: body
            required: true
            schema:
              $ref: '#/definitions/ProviderAuthInfoReq'

        responses:
          '200':
            description: 成功

  /v1/{project_id}/model-manager/integration/providers/{id}:
    get:
      tags:
        - ProviderMgmt
      description: 查询供应商详情
      operationId: IntegrationModelServiceProviderDetail
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 模型服务供应商列表
          schema:
            $ref: '#/definitions/ModelServiceProviderRsp'


    put:
      tags:
        - ProviderMgmt
      description: 更新供应商信息
      operationId: UpdateModelServiceProvider
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: available_check
          type: boolean
          required: false
          in: query
        - name: provider
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModelServiceProviderReq'

      responses:
        '200':
          description: 成功


    delete:
      tags:
        - ProviderMgmt
      description: 删除供应商信息
      operationId: DeleteModelServiceProvider
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$

      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/provider/auths:
    get:
      tags:
        - ProviderAuthMgmt
      description: 查询供应商认证配置
      operationId: AuthConfigList
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: provider_id
          in: query
          required: false
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: metadata_id
          in: query
          required: false
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功
          schema:
            $ref: '#/definitions/ProviderAuthCfgList'

    post:
      tags:
        - ProviderAuthMgmt
      description: 认证配置设置
      operationId: CreateAuthConfig
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: available_check
          type: boolean
          required: false
          in: query
        - name: config
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateAuthConfigReq'
      responses:
        '200':
          description: 成功

    delete:
      tags:
        - ProviderAuthMgmt
      description: 移除供应商认证配置
      operationId: RemoveProviderAuthCfg
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: provider_id
          in: query
          required: false
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: auth_id
          in: query
          required: false
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/provider/auths/{id}:
    delete:
      tags:
        - ProviderAuthMgmt
      description: 移除供应商认证配置
      operationId: RemoveAuthConfig
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/model-services:
    get:
      tags:
        - ModelServiceMgmt
      description: 查询模型服务
      operationId: ModelServiceList
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: page_size
          in: query
          type: integer
          format: int32
          default: 5
          minimum: 1
          maximum: 500
        - name: page_num
          in: query
          type: integer
          format: int32
          default: 1
          minimum: 1
        - name: provider_id
          in: query
          type: string
          maxLength: 80
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: service_name
          in: query
          type: string
          maxLength: 64
        - name: model_name
          in: query
          type: string
          maxLength: 64
          pattern: ^[\u4e00-\u9fa5a-zA-Z0-9:. _/|\\-]{1,64}$
        - name: model_type
          in: query
          type: string
          pattern: (LLM|Text-Embedding|RERANK|TEXT-TO-IMAGE|IMAGE-TO-TEXT|AUDIO-TO-TEXT|TEXT-TO-AUDIO|TEXT-IMAGE-EMBEDDING)
          required: false
        - name: publish_status
          in: query
          required: false
          pattern: ^(?:offline|online)?$
          type: string
        - name: id
          in: query
          type: string
          maxLength: 80
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: context_length
          in: query
          required: false
          description: "上下文长度"
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 16
        - name: model_series
          in: query
          required: false
          description: "模型系列"
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 16
        - name: model_types
          in: query
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        - name: is_support_deep_thinking
          in: query
          type: boolean
          description: "是否支持深度思考"
        - name: is_support_function_call
          in: query
          type: boolean
          description: "是否支持FunctionCall"
        - name: is_subscribed
          in: query
          type: boolean
          description: "在线推理服务是否已开通; true: 已开通, false: 未开通"
        - name: functioncall
          in: query
          type: boolean
      responses:
        '200':
          description: 成功
          schema:
            $ref: '#/definitions/ModelServiceListRsp'

    post:
      tags:
        - ModelServiceMgmt
      description: 新增模型服务
      operationId: CreateModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: available_check
          in: query
          required: false
          type: boolean
          default: false
        - name: modelservice
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModelServiceReq'
      responses:
        '200':
          description: 成功
          schema:
            type: object


  /v1/{project_id}/model-manager/model-services/sync:
    post:
      tags:
        - ModelServiceMgmt
      description: 同步第三方模型服务
      operationId: SyncModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: provider_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 同步第三方服务列表成功
          schema:
            $ref: '#/definitions/BaseResp'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'


  /v1/{project_id}/model-manager/model-services/{id}:
    get:
      tags:
        - ModelServiceMgmt
      description: 查询模型服务详情
      operationId: ModelServiceDetail
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功
          schema:
            $ref: '#/definitions/ModelServiceRsp'

    put:
      tags:
        - ModelServiceMgmt
      description: 更新模型服务
      operationId: UpdateModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: available_check
          in: query
          required: false
          type: boolean
          default: false
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
        - name: modelservice
          in: body
          required: true
          schema:
            $ref: '#/definitions/ModelServiceReq'
      responses:
        '200':
          description: 成功
          schema:
            type: object

    delete:
      tags:
        - ModelServiceMgmt
      description: 删除模型服务
      operationId: DeleteModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/model-services/{id}/online:
    post:
      tags:
        - ModelServiceMgmt
      description: 发布模型服务
      operationId: OnlineModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: available_check
          in: query
          required: false
          type: boolean
          default: false
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/model-services/{id}/offline:
    post:
      tags:
        - ModelServiceMgmt
      description: 取消发布模型服务
      operationId: OfflineModelService
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: id
          in: path
          type: string
          required: true
          pattern: ^[a-zA-Z0-9_-]{1,80}$
      responses:
        '200':
          description: 成功


  /v1/{project_id}/model-manager/available/model-services:
    get:
      tags:
        - ModelServiceMgmt
      description: 查询可用的模型服务
      operationId: AvailableModelServices
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: provider_id
          in: query
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]{1,40}$
        - name: workspace_id
          in: query
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_()\-]{1,40}$
        - name: service_name
          in: query
          type: string
          maxLength: 1000
        - name: model_name
          in: query
          type: string
          pattern: '^[\u4e00-\u9fa5a-zA-Z0-9](?:[\u4e00-\u9fa5a-zA-Z0-9_.\\/:| -]{0,62}[\u4e00-\u9fa5a-zA-Z0-9_-])?$'
        - name: model_type
