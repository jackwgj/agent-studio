swagger: '2.0'
info:
  version: v1
  title: controller manager API
  description: controller manager API
schemes:
  - https
host: localhost.com
basePath: /
tags:
  - name: ControllerConversationMgmt
    description: "多智能体会话管理"
paths:
  /v1/{project_id}/controller/{agent_id}/conversations:
    get:
      tags:
        - ControllerConversationMgmt
      description: "查询用户的Controller对话列表"
      operationId: ListControllerConversations
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: agent_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 100000
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
        - name: start_time
          in: query
          required: false
          type: integer
          format: int64
        - name: end_time
          in: query
          required: false
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ListControllerConversionsResp'
        '400':
          description: ''
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1

  /v1/{project_id}/controller/{agent_id}/conversations/{conversation_id}/executions:
    get:
      tags:
        - ControllerConversationMgmt
      description: "查询用户的Controller对话列表"
      operationId: ListControllerExecutions
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: agent_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: conversation_id
          in: path
          required: true
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 100000
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: "Controller对话query列表"
          schema:
            $ref: '#/definitions/ListControllerExecutionsResp'
        '400':
          description: ''
          schema:
            $ref: '#/definitions/ErrorRsp'

  /v1/{project_id}/controller/{agent_id}/executions/{execution_id}:
    get:
      tags:
        - ControllerConversationMgmt
      operationId: GetControllerExecutionDetail
      description: "查询多智能体会话的指定对话详情"
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: agent_id
          in: path
          required: true
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: execution_id
          in: path
          required: true
          type: string
          maxLength: 64
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 100000
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: "Controller会话的的对话详情"
          schema:
            $ref: '#/definitions/ControllerExecutionDetail'

definitions:
  ListControllerConversionsResp:
    type: object
    description: "查询多智能体会话列表返回模型"
    required:
      - count
      - conversations
    properties:
      count:
        type: integer
        description: "总数"
      conversations:
        type: array
        items:
          $ref: '#/definitions/ControllerConversation'
  ControllerConversation:
    type: object
    properties:
      project_id:
        type: string
      agent_id:
        type: string
      conversation_id:
        type: string
      inputs:
        type: object
      outputs:
        type: object
      status:
        type: string
      start_time:
        type: integer
        format: int64
      end_time:
        type: integer
        format: int64
  ListControllerExecutionsResp:
    type: object
    description: "查询Controller会话的对话列表的返回模型"
    properties:
      count:
        type: integer
        format: int32
        description: "总数"
      executions:
        type: array
        items:
          $ref: '#/definitions/ControllerExecution'
        description: "Controller会话的对话信息"
  ControllerExecution:
    type: object
    description: "Controller会话的对话信息"
    properties:
      execution_id:
        type: string
        description: "对话ID"
      query:
        type: string
        description: "query信息"
      status:
        type: string
      error_info:
        type: string
      start_time:
        type: integer
        format: int64
        description: "对话开始时间"
  ControllerExecutionDetail:
    type: object
    description: "多智能体会话的对话详情"
    properties:
      conversation_id:
        type: string
        description: 会话ID
      execution_id:
        type: string
        description: 对话ID
      inputs:
        type: string
        description: 输入参数
      outputs:
        type: string
        description: 输出参数
      error_info:
        type: string
        description: 错误信息
      invocations:
        type: array
        items:
          $ref: '#/definitions/ControllerInvokeInfo'
        description: 调用节点信息
      status:
        type: string
        description: 状态
      start_time:
        type: integer
        format: int64
        description: 开始时间
      end_time:
        type: integer
        format: int64
        description: 结束时间
      nestedWorkflows:
        type: array
        items:
          $ref: '#/definitions/WorkflowBaseData'
  WorkflowBaseData:
    type: object
    description: "工作流基础信息"
    properties:
      workflow_id:
        type: string
        description: "工作流id"
        maxLength: 64
      workflow_name:
        type: string
        description: "工作流名称"
        maxLength: 1000
  ControllerInvokeInfo:
    type: object
    properties:
      invoke_id:
        type: string
        maxLength: 128
        description: "invokeId"
      parent_invoke_id:
        type: string
        maxLength: 128
        description: "parentInvokeId"
      node_id:
        type: string
        maxLength: 128
        description: "节点id"
      node_name:
        type: string
        maxLength: 128
        description: "节点名称"
      node_type:
        type: string
        maxLength: 32
        description: "节点类型"
      node_status:
        type: string
        description: "节点运行状态, started/finished"
      parent_node_id:
        type: string
        maxLength: 128
        description: "父节点id"
      model_deployment_id:
        type: string
        description: 模型ID
      error_message:
        type: string
        maxLength: 4096
        description: 错误信息
      status:
        type: object
        description: "节点执行的结果状态, 成功/失败"
        properties:
          code:
            type: integer
            description: "状态码"
          desc:
            type: string
            maxLength: 1024
            description: "状态描述"
      messages:
        type: array
        items:
          $ref: '#/definitions/Message'
        description: user消息
      inputs:
        type: object
        description: 输入参数
      outputs:
        type: object
        description: 输出参数
      start_time:
        type: integer
        format: int64
        description: 开始时间，13位时间戳
      end_time:
        type: integer
        format: int64
        description: 结束时间，13位时间戳
      application_id:
        type: string
        maxLength: 128
        description: "节点归属的应用id"
      application_type:
        type: string
        description: "节点归属的应用的类型"
        enum:
          - "AGENT"
          - "WORKFLOW"
          - "LLM"
          - "CONTROLLER"
      parent_application_id:
        type: string
        maxLength: 128
        description: "若节点归属的应用被嵌套调用, 则表示其父级应用id"
      metadata:
        type: object
        additionalProperties:
          type: object
        description: 节点特有的输出，如：大模型原始回复debug才设置
  Message:
    type: object
    properties:
      role:
        type: string
        minLength: 1
        maxLength: 64
        description: 角色
      content:
        type: string
        description: 内容
      create_time:
        type: integer
        format: int64
        description: 时间戳
      name:
        type: object
        description: 工具名称
      function_call:
        type: object
        description: 工具调用信息
      tool_calls:
        type: object
        description: 工具调用信息
      tool_call_id:
        type: object
        description: 工具调用ID信息
      enable_history:
        type: boolean
        description: 是否开启会话历史
      intent:
        type: array
        items:
          type: string
      execution_id:
        type: string
        description: 对话ID
      node_id:
        type: string
        description: 节点ID
      agent_id:
        type: string
        description: agent id
      rating:
        type: integer
        minimum: -1
        maximum: 1
        description: 评分，-1（点赞）、1（点踩）
      files:
        type: array
        description: 多模态文件列表
        items:
          type: object
      reason:
        $ref: '#/definitions/FeedbackReason'
  FeedbackReason:
    type: object
    description: 用户反馈原因
    required:
      - tags
    properties:
      tags:
        type: array
        description: 原因标签列表
        minItems: 1
        maxItems: 10
        items:
          type: string
          maxLength: 64
      content:
        type: string
        description: 具体原因内容
        maxLength: 256
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息