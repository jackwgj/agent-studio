<div class="file-editor" #container>
  <div class="file-editor" #container>
    <div class="file-tree-box" [style.--sidebar-width.px]="fileTreeWidth">
      <div class="header">
        <div class="header-inner">
          <span nz-icon [nzType]="'folder'" nzTheme="outline"></span>
          <div class="ml-[8px]">{{ 'skill.detail.editor.file' | i18n }}</div>
        </div>
      </div>
      <div class="file-tree">
        <custom-file-tree [treeData]="innerData" (onNodeSelect)="onNodeSelect($event)"></custom-file-tree>
      </div>
    </div>
    <div class="resizer" (mousedown)="startResizing($event)"></div>
    <div class="editor-box">
      <div class="header">
        <div class="header-inner">
          <div class="flex-center">
            <custom-editor-icon [name]="selectedFileData?.fileIcon"></custom-editor-icon>
            <div class="file-label ml-[4px]">{{ selectedFileData?.label }}</div>
          </div>
          <div class="editor-tab">
            <nz-radio-group [(ngModel)]="selectedTab">
            @for (tab of tabs; track tab.id; let i = $index) {
              <label nz-radio-button [nzValue]="tab.id" [title]="tab.tip" [nzDisabled]="tab.disabled">
                <custom-editor-icon class="tab-class" [name]="tab.iconName"></custom-editor-icon>
              </label>
            }
          </nz-radio-group>
          </div>
        </div>
      </div>
      @if (selectedTab === skillEditorTab.MD && markdownContent) {
      <div class="md-box markdown-body" (click)="handlePreviewClick($event)" #scrollContainer>
        <markdown [data]="markdownContent"></markdown>
      </div>
      } @if (selectedTab === skillEditorTab.CODE) {
      <div class="code-box">
        <ngx-monaco-editor [options]="editorOptions" [(ngModel)]="code"> </ngx-monaco-editor>
      </div>
      } @if (!selectedTab) {
      <div class="editor-tip">{{ editorTip }}</div>
      }
    </div>
  </div>
</div>
