<nz-drawer
  [nzVisible]="isVisible"
  [nzMaskClosable]="true"
  [nzTitle]="'modify_kb' | i18nextEager"
  [nzWidth]="'500px'"
  (nzOnClose)="clearValue()"
  [nzFooter]="footerTpl"
>
  <ng-container *nzDrawerContent>
    <form nz-form [formGroup]="formGroup" nzLayout="vertical" class="kb-content-edit">
      <nz-form-item>
        <nz-form-label>{{ 'knowledge_icon' | i18nextEager }}</nz-form-label>
        <nz-form-control>
          <upload-image #uploadImage (imageChanged)="onImageChanged($event)"></upload-image>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>{{ 'knowledge_name' | i18nextEager }}</nz-form-label>
        <nz-form-control>
          <input nz-input
                 formControlName="name"
                 [placeholder]="'enter_knowledge_base_name' | i18nextEager"
                 maxlength="50"
                 style="width: 100%" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>{{ 'description' | i18nextEager }}</nz-form-label>
        <nz-form-control>
          <textarea nz-input
                    formControlName="description"
                    [placeholder]="'enter_knowledge_base_description' | i18nextEager"
                    maxlength="100"
                    [rows]="8"
                    style="width: 100%; resize: vertical;">
          </textarea>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-drawer>

<ng-template #footerTpl>
  <div style="text-align: right;">
    <button nz-button (click)="clearValue()" style="margin-right: 8px;">
      {{ 'cancel' | i18nextEager }}
    </button>
    <button nz-button nzType="primary" nzDanger (click)="handleConfirm()">
      {{ 'ok' | i18nextEager }}
    </button>
  </div>
</ng-template>
