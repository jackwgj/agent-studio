<ng-template #exceedModal let-context="context">
  <div *nzModalTitle id="exceed-header">
    <div class="header">
      <img alt="" class="info" [src]="changeUrl('assets/images/common/info.png')" />
      <span>{{ 'exceed_tip_header' | i18nextEager }}</span>
    </div>
  </div>
  <div *nzModalContent>
    <span *ngIf="type !== 'default'">{{ exceedTip }}</span>
    <div *ngIf="type === 'default'">
      <div>{{ exceedTip }}</div>
      <div>{{ 'exceed_tip_content_3' | i18nextEager }}</div>
    </div>
  </div>
  <div *nzModalFooter>
    <button (click)="context.close()" type="button" nz-button>
      {{ 'base_close' | i18nextEager }}
    </button>

    <button *ngIf="type === 'default' && purchaseUrl" (click)="goToPurchasePage(); context.close()" type="button" nz-button [nzType]="isPayed ? 'primary' : 'default'">
          {{ 'toShopGuide' | i18nextEager }}
    </button>
    <button
      *ngIf="type === 'default' && !isPayed"
      (click)="upgradeToBusinessEdition(); context.close()"
      type="button"
      nz-button nzType="primary"
      class="ml8"
    >
      {{ 'upgrade_to_commercial_1' | i18nextEager }}
    </button>
  </div>
</ng-template>
