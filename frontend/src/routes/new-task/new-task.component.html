<div class="nt-layout">
  <!-- 左栏：任务列表 -->
  <aside class="nt-left">
    <div class="nt-left-header">
      <span class="nt-title">{{ 'new_task' | i18nextEager }}</span>
      <button nz-button nzType="primary" nzSize="small" (click)="onNewTask()">
        <span nz-icon nzType="plus"></span>{{ 'new_task_again' | i18nextEager }}
      </button>
    </div>
    <nz-list class="nt-list" [nzDataSource]="taskList" [nzSplit]="true">
      <ng-container *nzListItem="let item">
        <nz-list-item (click)="onSelectTask(item)" [class.active]="item.id === store.taskId">
          <div class="nt-task-item">
            <div class="nt-task-name">{{ item.name || ('new_task_no_desc' | i18nextEager) }}</div>
            <nz-tag [nzColor]="statusColor(item.status)">{{ item.status }}</nz-tag>
          </div>
        </nz-list-item>
      </ng-container>
    </nz-list>
  </aside>

  <!-- 中栏：多轮对话 -->
  <section class="nt-center">
    <div class="nt-center-header">
      <span class="nt-title">{{ store.taskName || ('new_task' | i18nextEager) }}</span>
      <nz-tag *ngIf="store.status" [nzColor]="statusColor(store.status)">{{ store.status }}</nz-tag>
    </div>

    <div class="nt-conversation">
      <div
        *ngFor="let t of store.turns"
        class="nt-bubble"
        [class.user]="t.role === 'user'"
        [class.assistant]="t.role === 'assistant'"
      >
        <div class="nt-bubble-content">
          <markdown *ngIf="t.role === 'assistant' && t.content" [data]="t.content"></markdown>
          <span *ngIf="t.role === 'user'">{{ t.content }}</span>
          <div *ngIf="t.assets && t.assets.length" class="nt-asset-chips">
            <nz-tag *ngFor="let a of t.assets">{{ a.name || a.id }}</nz-tag>
          </div>
        </div>
      </div>
    </div>

    <div class="nt-input-area">
      <div class="nt-draft-assets" *ngIf="draftAssets.length">
        <nz-tag
          *ngFor="let a of draftAssets; let i = index"
          nzMode="closeable"
          (nzOnClose)="removeDraftAsset(i)"
          >{{ a.name || a.id }}</nz-tag
        >
      </div>
      <div class="nt-input-row">
        <button
          nz-button
          nzType="text"
          nz-popover
          [nzPopoverContent]="assetTpl"
          nzPopoverTitle="{{ 'new_task_asset' | i18nextEager }}"
          [(nzPopoverVisible)]="assetPopoverVisible"
        >
          <span nz-icon nzType="plus"></span>
        </button>
        <textarea
          nz-input
          class="nt-textarea"
          [(ngModel)]="draftInput"
          [placeholder]="'new_task_chat_placeholder' | i18nextEager"
          (keydown.enter)="$event.preventDefault(); onSend()"
        ></textarea>
        <button nz-button nzType="primary" [nzLoading]="store.streaming" (click)="onSend()">
          {{ 'new_task_send' | i18nextEager }}
        </button>
      </div>
    </div>
  </section>

  <!-- 右栏：实时预览 -->
  <aside class="nt-right">
    <div class="nt-right-header">{{ 'new_task_preview' | i18nextEager }}</div>
    <app-preview-panel [data]="store.preview" [loading]="store.streaming"></app-preview-panel>
  </aside>
</div>

<ng-template #assetTpl>
  <app-asset-picker [(selected)]="draftAssets"></app-asset-picker>
</ng-template>
