<div class="model-service-compare-router" >
  <div class="debug-header-container" *ngIf="serviceInfo?.length!==2">
    <div class="title">{{ 'effect_preview' | i18nextEager }}</div>
    <div class="chat-header-icon" nz-tooltip [nzTooltipTitle]="'clear' | i18nextEager" >
      <span nz-icon nzType="delete" nzTheme="outline" (click)="clearChat()"></span>
    </div>
  </div>

  <div class="main-wrapper-history">
    <div *ngIf="serviceInfo?.length===2" class="model-compare-header">
      <div class="text-[14px]" style="font-weight: 700;">{{ 'model_compare' | i18nextEager }}</div>
      <div class="chat-header-icon" nz-tooltip [nzTooltipTitle]="'agent_clear' | i18nextEager" >
        <span nz-icon nzType="delete" nzTheme="outline" (click)="clearChat()"></span>
      </div>
    </div>

    <div
      nz-row
      *ngIf="serviceInfo?.length===2"
      style="height: calc(100% - 164px); margin: 0px;"
    >
      <div nz-col [nzSpan]="12" style="height: 100%;">
        <div class="history-container">
          <div class="compare-model-title">
            <img alt="" src="{{serviceInfo[0]?.logo || changeUrl('assets/model/assist.svg')}}" >
            <p>{{serviceInfo[0]?.name}}</p>
          </div>
          <div
            class="main-container"
            cdkScrollable
            #chatContainerLeftRef
            (scroll)="onScroll($event.target)"
          >
            <div
              [ngClass]="
            dialogHistory[0].length === 0
              ? 'init-chat-content-container'
              : 'chat-content-container gap-[24px]'
          "
            >
              <ng-container *ngIf="dialogHistory[0].length > 0">
                <div
                  class="chat-content"
                  *ngFor="let item of dialogHistory[0]; let i = index"
                >
                  <model-chat-item
                    class="flex flex-col gap-4"
                    [data]="item"
                    [conversationId]="uuid"
                    [messageId]="item[0].messageId"
                    [isError]="item[0].isError"
                    [agentName]="serviceInfo[0]?.name"
                  ></model-chat-item>
                </div>

                <div *ngIf="isLoading[0]" class="chat-loading-message">
                  <img alt=""
                    [src]="changeUrl('assets/agent-center/images/running.webp')"
                    [alt]="'loading' | i18nextEager"
                  />
                  <span>{{ 'recognizing_user_intent' | i18nextEager }}</span>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
      <div nz-col [nzSpan]="12" style="height: 100%; border-left: 1px solid #DBDBDB;">
        <div class="history-container">
          <div class="compare-model-title">
            <img alt="" src="{{serviceInfo[1]?.logo || changeUrl('assets/model/assist.svg')}}" >
            <p>{{serviceInfo[1]?.name}}</p>
          </div>
          <div
            class="main-container"
            cdkScrollable
            #chatContainerRightRef
            (scroll)="onScroll($event.target)"
          >
            <div
              [ngClass]="
            dialogHistory[1].length === 0
              ? 'init-chat-content-container'
              : 'chat-content-container gap-[24px]'
          "
            >
              <ng-container *ngIf="dialogHistory[1].length > 0">
                <div
                  class="chat-content"
                  *ngFor="let item of dialogHistory[1]; let i = index"
                >
                  <model-chat-item
                    class="flex flex-col gap-4"
                    [data]="item"
                    [conversationId]="uuid"
                    [messageId]="item[0].messageId"
                    [isError]="item[0].isError"
                    [agentName]="serviceInfo[1]?.name"
                  ></model-chat-item>
                </div>

                <div *ngIf="isLoading[1]" class="chat-loading-message">
                  <img alt=""
                    [src]="changeUrl('assets/agent-center/images/running.webp')"
                    [alt]="'loading' | i18nextEager"
                  />
                  <span>{{ 'recognizing_user_intent' | i18nextEager }}</span>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      nz-row
      *ngIf="serviceInfo?.length<2"
      style="height: calc(100% - 114px); margin: 0px;"
    >
      <div nz-col [nzSpan]="24" style="height: 100%">
        <div class="history-container">
          <div
            class="main-container"
            cdkScrollable
            #chatContainerLeftRef
            (scroll)="onScroll($event.target)"
          >
            <div
              [ngClass]="
            dialogHistory[0].length === 0
              ? 'init-chat-content-container'
              : 'chat-content-container gap-[24px]'
          "
            >
              <ng-container *ngIf="dialogHistory[0].length > 0">
                <div
                  class="chat-content"
                  *ngFor="let item of dialogHistory[0]; let i = index"
                >
                  <model-chat-item
                    class="flex flex-col gap-4"
                    [data]="item"
                    [conversationId]="uuid"
                    [messageId]="item[0].messageId"
                    [isError]="item[0].isError"
                    [agentName]="serviceInfo[0]?.name"
                  ></model-chat-item>
                </div>

                <div *ngIf="isLoading[0]" class="chat-loading-message">
                  <img alt=""
                    [src]="changeUrl('assets/agent-center/images/running.webp')"
                    [alt]="'loading' | i18nextEager"
                  />
                  <span>{{ 'recognizing_user_intent' | i18nextEager }}</span>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-container">
      <model-meta-sender
        [showClear]="false"
        [modelType]="modelType"
        [sending]="isShowStopIcon"
        [disabled]="!serviceInfo[0]?.id"
        [maxlength]="userQueryLimit"
        (send)="sendQuestion($event)"
        (stop)="stopChat()"
      />
    </div>
  </div>
</div>
