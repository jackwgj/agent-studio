<div>{{ 'copytoaspacecomponent_1180'| i18nextEager }}</div>

<div>
  <nz-form-item>
    <nz-form-control>
      <nz-select
        style="width:100%"
        [(ngModel)]="space_value"
        nzPlaceHolder="{{ 'copytoaspacecomponent_1179'| i18nextEager }}"
      >
        @for (option of space_options; track option.id) {
          <nz-option [nzValue]="option.id" [nzLabel]="option.name"></nz-option>
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>
</div>
<div class="!pt-[24px] text-right">
  <div>
    <button nz-button (click)="dismiss()" class="mr-[8px]">{{ 'cancel' | i18nextEager }}</button>
    <button nz-button nzType="primary" (click)="submitFn()" [nzLoading]="btnLoading">{{ 'ok' | i18nextEager }}</button>
  </div>
</div>
