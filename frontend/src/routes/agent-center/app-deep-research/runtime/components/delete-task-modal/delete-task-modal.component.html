<div class="ant-modal-header">

</div>
<div class="ant-modal-body">
  <div class="flex flex-col gap-2">
    {{'deleteTip'|i18nextEager}}
  </div>
</div>
<div class="ant-modal-footer">
  <button type="button" (click)="dismiss()" nz-button>{{ 'cancel' | i18nextEager }}</button>

    {{ 'button_confirm' | i18nextEager }}
  </button>
</div>
