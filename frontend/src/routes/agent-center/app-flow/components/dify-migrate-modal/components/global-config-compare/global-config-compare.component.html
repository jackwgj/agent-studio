<div class="flex flex-col gap-[8px]">
  <p class="node-title">{{ 'global_configuration' | i18nextEager }}</p>

  @if (showLlmSelectTip && !selected) {
    <nz-alert class="!w-[100%]" nzType="warning" [nzMessage]="'global_config_llm_tip' | i18nextEager"></nz-alert>
  }

  <migrate-compare-row>
    <div left>
      <div class="left-compare-card h-[28px]">
        <span>{{ oldModelName || '--' }}</span>
      </div>
    </div>

    <div right>
      <llm-select
        [selectedModel]="selected"
        [modelValidation]="modelValidation" (update)="updateModel($event)">
      </llm-select>
    </div>
  </migrate-compare-row>
</div>
