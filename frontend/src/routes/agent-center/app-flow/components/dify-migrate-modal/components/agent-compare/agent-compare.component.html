<div class="flex flex-col gap-[8px]">
  <p class="node-title">{{ node.name }}</p>

  <migrate-compare-row>
    <div left>
      <div class="left-compare-card h-[28px]">
        <span>{{ oldModelName || '--' }}</span>
      </div>
    </div>

    <div right>
      <llm-select
        [selectedModel]="selected"
        [modelValidation]="modelValidation" (update)="updateModel($event)">
      </llm-select>
    </div>
  </migrate-compare-row>
</div>
