<div *nzModalTitle>{{ 'select_tool' | i18nextEager }}</div>
<ng-container>
  <div class="flex items-center p-[16px] rounded-[8px] mcp-info-wrap">
    <img class="w-[40px] h-[40px]" [src]="getMcpIcon(mcp?.avatar)" alt="icon" />
    <div class="flex-1 ml-[12px] max-w-[400px]">
      <p class="mb-[4px] truncate" [title]="mcp?.name">{{ mcp?.name }}</p>
      <p class="text-[12px] leading-[18px] text-[#808080] truncate" [title]="mcp?.desc || '--'">{{ mcp?.desc || '--' }}</p>
    </div>
  </div>
  <div class="flex mt-[16px] flex-col list-wrap">
    @if (loading) {
      <nz-spin class="loading-icon"></nz-spin>
    } @else {
      <div>
        <button
          nz-button
          [disabled]="displayed.length === 0 || selectedNum === tools.length"
          (click)="selectAll()"
        >
          {{ 'add_all' | i18nextEager }}
        </button>
        <span class="ml-[8px] text-[12px] leading-[18px] text-[#808080]">
            {{ 'added' | i18nextEager }}{{ selectedNum }}/{{ tools.length }}
          </span>
      </div>
      @for (tool of displayed; track tool.id) {
        <div class="mt-[16px]">
          <meta-tool-card [tool]="tool" [hasBorder]="true" />
        </div>
      }
      <nz-pagination
        class="mt-[16px] pb-[24px]"
        [nzSize]="'small'"
        [(nzPageIndex)]="currentPage"
        [nzTotal]="tools.length"
        [(nzPageSize)]="pageSize"
        (nzPageIndexChange)="pageUpdated($event)"
      ></nz-pagination>
    }
  </div>
</ng-container>
<ng-container *nzModalFooter>
  <div class="flex justify-end gap-2">
    <button type="button" nz-button (click)="dismiss()">{{ 'cancel' | i18nextEager }}</button>
    <button
      [nzLoading]="btnLoading"
      type="button"
      nz-button
      nzType="primary"
      [disabled]="selectedNum === 0"
      (click)="confirm()"
    >
      {{ 'ok' | i18nextEager }}
    </button>
  </div>
</ng-container>
