<div class="conversation-workspace">
  <!-- 聊天区（居中卡片） -->
  <div class="chat-area">
    <div class="chat-header">
      <span>{{ currentSession?.title || '任务空间' }}</span>
    </div>

    <div class="message-list" #messageList>
      <div *ngIf="!messages.length" class="chat-empty">
        选择左侧会话或新建会话，选择模型后开始对话
      </div>
      <div
        *ngFor="let message of messages; let i = index"
        class="message-row"
        [class.user]="message.role === 'user'"
      >
        <div class="message-bubble" [class.sub-agent]="message.isSubAgent">
          <div class="message-role">{{ roleLabel(message) }}</div>
          <div class="message-content">
            <span>{{ message.content }}</span>
            <span *ngIf="message.loading" class="loading-dots">…</span>
          </div>
          <div *ngIf="message.error" class="message-error">请求失败，请重试</div>
        </div>
      </div>
    </div>

    <div class="chat-composer">
      <textarea
        nz-input
        class="composer-input"
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="6"
        placeholder="输入消息，Enter 发送，Shift+Enter 换行"
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
      ></textarea>

      <div class="composer-toolbar">
        <div class="composer-tools">
          <button
            nz-button
            class="tool-btn"
            disabled
            nz-tooltip
            nzTooltipTitle="上传（暂未开放）"
          >
            <nz-icon nzType="upload" nzTheme="outline"></nz-icon>
          </button>
          <button
            nz-button
            class="tool-btn"
            disabled
            nz-tooltip
            nzTooltipTitle="语音（暂未开放）"
          >
            <nz-icon nzType="audio" nzTheme="outline"></nz-icon>
          </button>
          <button
            nz-button
            class="tool-btn"
            disabled
            nz-tooltip
            nzTooltipTitle="Token 用量（暂未开放）"
          >
            <nz-icon nzType="number" nzTheme="outline"></nz-icon>
          </button>
        </div>

        <div class="composer-actions">
          <nz-select
            *ngIf="modelOptions.length"
            class="model-pill"
            nzPlaceHolder="选择模型"
            [(ngModel)]="selectedModel"
            nzSize="small"
          >
            <nz-option
              *ngFor="let model of modelOptions"
              [nzValue]="model.deployment_id"
              [nzLabel]="model.label"
            ></nz-option>
          </nz-select>
          <span *ngIf="!modelOptions.length" class="model-empty">暂无可用模型</span>

          <button
            nz-button
            nzType="primary"
            nzShape="circle"
            class="send-btn"
            [nzLoading]="streaming"
            [disabled]="!inputText.trim() || streaming || !selectedModel"
            (click)="send()"
          >
            <nz-icon nzType="send" nzTheme="outline"></nz-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
